</style></head><body><canvas id="game" width="800" height="450" aria-label="Игра"></canvas><div id="error" role="alert"></div><script>
(()=>{'use strict';
const project={"title":"Игра","source":"\nlet playerX = 400;\nlet playerY = 225;\nlet speed = 185;\nlet playerHP = 5;\nlet maxHP = 5;\nlet score = 0;\nlet gameOver = false;\nlet gameTime = 0;\nlet wave = 1;\n// Номер волны продолжает расти, но сложность после 15-й больше не повышается.\nlet difficultyWave = 1;\nlet kills = 0;\nlet combo = 0;\nlet comboTimer = 0;\nlet bestScore = 0;\nlet screen = \"menu\";\nlet menuWasDown = false;\n\nlet joyX = 0;\nlet joyY = 0;\nlet joy2X = 0;\nlet joy2Y = 0;\n\nlet fireCooldown = 0;\nlet fireRate = 0.17;\nlet spawnTimer = 0;\nlet hitFlash = 0;\nlet invulnerable = 0;\nlet shieldTime = 0;\nlet rapidTime = 0;\nlet dashTime = 0;\nlet dashCooldown = 0;\nlet shake = 0;\nlet paused = false;\n\nlet bulletX = [];\nlet bulletY = [];\nlet bulletVx = [];\nlet bulletVy = [];\nlet bulletLife = [];\nlet bulletDamage = [];\n\nlet enemyX = [];\nlet enemyY = [];\nlet enemyHP = [];\nlet enemyMaxHP = [];\nlet enemyType = [];\nlet enemySpeed = [];\nlet enemyRadius = [];\nlet enemyFlash = [];\n\nlet particleX = [];\nlet particleY = [];\nlet particleVx = [];\nlet particleVy = [];\nlet particleLife = [];\nlet particleColor = [];\n\nlet pickupX = [];\nlet pickupY = [];\nlet pickupType = [];\nlet pickupLife = [];\n\nlet starX = [];\nlet starY = [];\nlet starSize = [];\n\nlet initialized = false;\n\n// Состояние босса и его отдельные снаряды\nlet bossActive = false;\nlet bossWave = 0;\nlet lastBossWave = 0;\nlet nextBossWave = 5;\nlet bossPhase = 1;\nlet bossAttackTimer = 0;\nlet bossSummonTimer = 0;\nlet bossSpecialTimer = 0;\nlet bossProjectX = [];\nlet bossProjectY = [];\nlet bossProjectVx = [];\nlet bossProjectVy = [];\nlet bossProjectLife = [];\nlet bossProjectRadius = [];\n\n// Звуковые эффекты: разные высоты и ритмы на доступном playTone().\n// Текущий API MrrCode принимает частоту, длительность и громкость;\n// форму волны (sin/square/sawtooth) этот вызов не позволяет выбрать.\nfunction soundMenu() {\n    playTone(520, 0.055, 0.10);\n    playTone(780, 0.075, 0.09);\n}\n\nfunction soundShoot() {\n    playTone(randomInt(430, 570), 0.025, 0.045);\n}\n\nfunction soundRatSmall() {\n    playTone(360, 0.045, 0.10);\n    playTone(245, 0.055, 0.07);\n}\n\nfunction soundRatFast() {\n    playTone(760, 0.035, 0.075);\n    playTone(520, 0.045, 0.06);\n}\n\nfunction soundRatTank() {\n    playTone(155, 0.11, 0.13);\n    playTone(115, 0.085, 0.10);\n}\n\nfunction soundBoss() {\n    playTone(220, 0.12, 0.16);\n    playTone(165, 0.15, 0.13);\n    playTone(110, 0.20, 0.11);\n}\n\nfunction soundDamage() {\n    playTone(185, 0.075, 0.18);\n    playTone(125, 0.11, 0.16);\n}\n\nfunction soundPickup() {\n    playTone(590, 0.045, 0.10);\n    playTone(790, 0.05, 0.10);\n    playTone(1050, 0.075, 0.08);\n}\n\nfunction soundGameOver() {\n    playTone(390, 0.10, 0.13);\n    playTone(260, 0.14, 0.13);\n    playTone(175, 0.22, 0.15);\n}\n\n\nfunction resetGame() {\n    playerX = 400;\n    playerY = 225;\n    playerHP = 5;\n    score = 0;\n    gameTime = 0;\n    wave = 1;\n    difficultyWave = 1;\n    bossActive = false;\n    bossWave = 0;\n    lastBossWave = 0;\n    nextBossWave = 5;\n    bossPhase = 1;\n    bossAttackTimer = 0;\n    bossSummonTimer = 0;\n    bossSpecialTimer = 0;\n    bossProjectX = [];\n    bossProjectY = [];\n    bossProjectVx = [];\n    bossProjectVy = [];\n    bossProjectLife = [];\n    bossProjectRadius = [];\n    kills = 0;\n    combo = 0;\n    comboTimer = 0;\n    fireCooldown = 0;\n    spawnTimer = 0.5;\n    hitFlash = 0;\n    invulnerable = 1.5;\n    shieldTime = 0;\n    rapidTime = 0;\n    dashTime = 0;\n    dashCooldown = 0;\n    shake = 0;\n    gameOver = false;\n    paused = false;\n\n    bulletX = [];\n    bulletY = [];\n    bulletVx = [];\n    bulletVy = [];\n    bulletLife = [];\n    bulletDamage = [];\n\n    enemyX = [];\n    enemyY = [];\n    enemyHP = [];\n    enemyMaxHP = [];\n    enemyType = [];\n    enemySpeed = [];\n    enemyRadius = [];\n    enemyFlash = [];\n\n    particleX = [];\n    particleY = [];\n    particleVx = [];\n    particleVy = [];\n    particleLife = [];\n    particleColor = [];\n\n    pickupX = [];\n    pickupY = [];\n    pickupType = [];\n    pickupLife = [];\n\n    joyX = 0;\n    joyY = 0;\n    joy2X = 0;\n    joy2Y = 0;\n}\n\nfunction addParticles(x, y, color, amount) {\n    for (let k = 0; k \u003c amount; k++) {\n        let a = random() * 6.28318;\n        let s = randomInt(35, 155);\n        push(particleX, x);\n        push(particleY, y);\n        push(particleVx, cos(a) * s);\n        push(particleVy, sin(a) * s);\n        push(particleLife, random() * 0.45 + 0.2);\n        push(particleColor, color);\n    }\n}\n\nfunction spawnEnemy() {\n    let side = randomInt(0, 3);\n    let ex = 0;\n    let ey = 0;\n\n    if (side == 0) {\n        ex = -22;\n        ey = randomInt(20, 430);\n    } else if (side == 1) {\n        ex = 822;\n        ey = randomInt(20, 430);\n    } else if (side == 2) {\n        ex = randomInt(20, 780);\n        ey = -22;\n    } else {\n        ex = randomInt(20, 780);\n        ey = 472;\n    }\n\n    let kind = 0;\n    let roll = randomInt(0, 99);\n\n    if (difficultyWave >= 2 && roll \u003c 24) {\n        kind = 1;\n    }\n    if (difficultyWave >= 3 && roll >= 24 && roll \u003c 40) {\n        kind = 2;\n    }\n    if (difficultyWave >= 5 && roll >= 40 && roll \u003c 49) {\n        kind = 3;\n    }\n\n    let hp = 1;\n    let spd = 42 + difficultyWave * 2;\n    let radius = 15;\n\n    if (kind == 1) {\n        hp = 2;\n        spd = 29 + difficultyWave;\n        radius = 21;\n    }\n    if (kind == 2) {\n        hp = 1;\n        spd = 86 + difficultyWave * 2;\n        radius = 11;\n    }\n    if (kind == 3) {\n        hp = 4 + floor(difficultyWave / 3);\n        spd = 24 + difficultyWave;\n        radius = 25;\n    }\n\n    if (spd > 100) {\n        spd = 100;\n    }\n\n    push(enemyX, ex);\n    push(enemyY, ey);\n    push(enemyHP, hp);\n    push(enemyMaxHP, hp);\n    push(enemyType, kind);\n    push(enemySpeed, spd);\n    push(enemyRadius, radius);\n    push(enemyFlash, 0);\n}\n\nfunction spawnBoss() {\n    // Удаляем обычных врагов с арены: бой с боссом проходит отдельно.\n    enemyX = [];\n    enemyY = [];\n    enemyHP = [];\n    enemyMaxHP = [];\n    enemyType = [];\n    enemySpeed = [];\n    enemyRadius = [];\n    enemyFlash = [];\n\n    bossActive = true;\n    bossWave = difficultyWave;\n    lastBossWave = wave;\n    bossPhase = 1;\n    bossAttackTimer = 1.15;\n    bossSummonTimer = 5;\n    bossSpecialTimer = 4.5;\n\n    push(enemyX, 400);\n    push(enemyY, 105);\n    push(enemyHP, 90 + difficultyWave * 12);\n    push(enemyMaxHP, 90 + difficultyWave * 12);\n    push(enemyType, 4);\n    push(enemySpeed, 58 + difficultyWave);\n    push(enemyRadius, 35);\n    push(enemyFlash, 0);\n\n    bossProjectX = [];\n    bossProjectY = [];\n    bossProjectVx = [];\n    bossProjectVy = [];\n    bossProjectLife = [];\n    bossProjectRadius = [];\n    soundBoss();\n}\n\nfunction fireBossProjectile(x, y, vx, vy, radius, life) {\n    push(bossProjectX, x);\n    push(bossProjectY, y);\n    push(bossProjectVx, vx);\n    push(bossProjectVy, vy);\n    push(bossProjectRadius, radius);\n    push(bossProjectLife, life);\n}\n\nfunction bossAimedShot() {\n    let dx = playerX - enemyX[0];\n    let dy = playerY - enemyY[0];\n    let d = sqrt(dx * dx + dy * dy);\n    if (d \u003c 0.01) d = 1;\n    let speedShot = 150 + bossPhase * 24 + floor(bossWave * 1.5);\n    fireBossProjectile(enemyX[0], enemyY[0], dx / d * speedShot, dy / d * speedShot, 9, 4.5);\n}\n\nfunction bossRadialBurst(count, speedShot) {\n    for (let n = 0; n \u003c count; n++) {\n        let a = 6.28318 * n / count + gameTime * 0.35;\n        fireBossProjectile(enemyX[0], enemyY[0], cos(a) * speedShot, sin(a) * speedShot, 7, 4.2);\n    }\n}\n\nfunction spawnBossMinion() {\n    if (!bossActive || length(enemyX) >= 9) return;\n    let a = random() * 6.28318;\n    let ex = enemyX[0] + cos(a) * 58;\n    let ey = enemyY[0] + sin(a) * 58;\n    if (ex \u003c 20) ex = 20;\n    if (ex > 780) ex = 780;\n    if (ey \u003c 35) ey = 35;\n    if (ey > 430) ey = 430;\n\n    push(enemyX, ex);\n    push(enemyY, ey);\n    push(enemyHP, 2 + floor(bossWave / 5));\n    push(enemyMaxHP, 2 + floor(bossWave / 5));\n    push(enemyType, 2);\n    push(enemySpeed, 88 + bossWave);\n    push(enemyRadius, 11);\n    push(enemyFlash, 0);\n}\n\nfunction spawnPickup(x, y) {\n    let kind = randomInt(0, 2);\n\n    if (kind == 0 && playerHP >= maxHP) {\n        kind = 1;\n    }\n\n    push(pickupX, x);\n    push(pickupY, y);\n    push(pickupType, kind);\n    push(pickupLife, 9);\n}\n\nfunction shoot(dx, dy) {\n    let len = sqrt(dx * dx + dy * dy);\n\n    if (len \u003c 0.01) {\n        return;\n    }\n\n    dx /= len;\n    dy /= len;\n\n    let damage = 1;\n    let bulletSpeed = 430;\n\n    if (rapidTime > 0) {\n        bulletSpeed = 510;\n    }\n\n    push(bulletX, playerX + dx * 19);\n    push(bulletY, playerY + dy * 19);\n    push(bulletVx, dx * bulletSpeed);\n    push(bulletVy, dy * bulletSpeed);\n    push(bulletLife, 1.5);\n    push(bulletDamage, damage);\n\n    addParticles(playerX + dx * 20, playerY + dy * 20, \"#7df9ff\", 2);\n}\n\n// Детализированный кот, нарисованный примитивами движка.\nfunction drawCat(x, y, scale, blink) {\n    let s = scale;\n    // Неоновая тень и хвост\n    circle(x, y + 3 * s, 18 * s, \"#102b45\");\n    line(x - 10 * s, y + 9 * s, x - 19 * s, y + 14 * s, \"#27d9ff\", 4 * s);\n    line(x - 19 * s, y + 14 * s, x - 23 * s, y + 8 * s, \"#27d9ff\", 4 * s);\n    line(x - 23 * s, y + 8 * s, x - 20 * s, y + 3 * s, \"#27d9ff\", 4 * s);\n\n    // Лапы\n    circle(x - 9 * s, y + 12 * s, 6 * s, \"#153e5a\");\n    circle(x + 9 * s, y + 12 * s, 6 * s, \"#153e5a\");\n    line(x - 10 * s, y + 13 * s, x - 10 * s, y + 16 * s, \"#7df9ff\", 1.5 * s);\n    line(x + 8 * s, y + 13 * s, x + 8 * s, y + 16 * s, \"#7df9ff\", 1.5 * s);\n\n    // Голова и щёки\n    circle(x, y, 17 * s, \"#061729\");\n    circle(x, y - 1 * s, 15 * s, \"#24bce8\");\n    circle(x, y + 2 * s, 12 * s, \"#173957\");\n    circle(x - 8 * s, y + 5 * s, 6 * s, \"#236487\");\n    circle(x + 8 * s, y + 5 * s, 6 * s, \"#236487\");\n\n    // Уши с внутренней розовой частью\n    line(x - 13 * s, y - 8 * s, x - 14 * s, y - 21 * s, \"#061729\", 7 * s);\n    line(x - 14 * s, y - 21 * s, x - 3 * s, y - 14 * s, \"#061729\", 7 * s);\n    line(x + 3 * s, y - 14 * s, x + 14 * s, y - 21 * s, \"#061729\", 7 * s);\n    line(x + 14 * s, y - 21 * s, x + 13 * s, y - 8 * s, \"#061729\", 7 * s);\n    line(x - 12 * s, y - 11 * s, x - 13 * s, y - 18 * s, \"#ff62c0\", 3 * s);\n    line(x - 13 * s, y - 18 * s, x - 6 * s, y - 13 * s, \"#ff62c0\", 3 * s);\n    line(x + 6 * s, y - 13 * s, x + 13 * s, y - 18 * s, \"#ff62c0\", 3 * s);\n    line(x + 13 * s, y - 18 * s, x + 12 * s, y - 11 * s, \"#ff62c0\", 3 * s);\n\n    // Глаза, блики и брови\n    line(x - 10 * s, y - 5 * s, x - 4 * s, y - 7 * s, \"#7df9ff\", 2 * s);\n    line(x + 4 * s, y - 7 * s, x + 10 * s, y - 5 * s, \"#7df9ff\", 2 * s);\n    if (blink) {\n        line(x - 10 * s, y - 1 * s, x - 4 * s, y - 1 * s, \"#baffff\", 3 * s);\n        line(x + 4 * s, y - 1 * s, x + 10 * s, y - 1 * s, \"#baffff\", 3 * s);\n    } else {\n        circle(x - 7 * s, y - 1 * s, 4 * s, \"#b9ffff\");\n        circle(x + 7 * s, y - 1 * s, 4 * s, \"#b9ffff\");\n        circle(x - 7 * s, y - 1 * s, 2 * s, \"#061729\");\n        circle(x + 7 * s, y - 1 * s, 2 * s, \"#061729\");\n        circle(x - 8 * s, y - 3 * s, 1.3 * s, \"#ffffff\");\n        circle(x + 6 * s, y - 3 * s, 1.3 * s, \"#ffffff\");\n    }\n\n    // Нос, мордочка, улыбка и усы\n    circle(x, y + 5 * s, 2 * s, \"#ff83cb\");\n    circle(x - 3 * s, y + 7 * s, 3 * s, \"#d8faff\");\n    circle(x + 3 * s, y + 7 * s, 3 * s, \"#d8faff\");\n    line(x, y + 6 * s, x, y + 9 * s, \"#061729\", 1.3 * s);\n    line(x, y + 9 * s, x - 3 * s, y + 10 * s, \"#061729\", 1.3 * s);\n    line(x, y + 9 * s, x + 3 * s, y + 10 * s, \"#061729\", 1.3 * s);\n    line(x - 5 * s, y + 6 * s, x - 18 * s, y + 3 * s, \"#c5faff\", 1 * s);\n    line(x - 5 * s, y + 8 * s, x - 18 * s, y + 9 * s, \"#c5faff\", 1 * s);\n    line(x + 5 * s, y + 6 * s, x + 18 * s, y + 3 * s, \"#c5faff\", 1 * s);\n    line(x + 5 * s, y + 8 * s, x + 18 * s, y + 9 * s, \"#c5faff\", 1 * s);\n    // Полоски на лбу\n    line(x - 3 * s, y - 11 * s, x, y - 8 * s, \"#7df9ff\", 1.5 * s);\n    line(x + 3 * s, y - 11 * s, x, y - 8 * s, \"#7df9ff\", 1.5 * s);\n}\n\n// Крыса с длинным хвостом, ушами, глазами, зубами и лапами.\nfunction drawRat(x, y, r, kind, flash) {\n    // Силуэт крысы масштабируется равномерно; у больших видов детали\n    // не вылезают далеко за корпус и не закрывают морду бронёй.\n    let s = r / 15;\n    if (s > 2.15) s = 2.15;\n    let fur = \"#9a6a9f\";\n    let dark = \"#32233f\";\n    let innerEar = \"#ff6b9e\";\n    let eye = \"#ff405d\";\n    if (kind == 1) { fur = \"#ad73d9\"; dark = \"#3d245e\"; }\n    else if (kind == 2) { fur = \"#d58b45\"; dark = \"#57351e\"; }\n    else if (kind == 3) { fur = \"#8b4d9e\"; dark = \"#27152f\"; }\n    else if (kind == 4) { fur = \"#d94b73\"; dark = \"#481c39\"; innerEar = \"#ff9aaf\"; eye = \"#fff07a\"; }\n    if (flash) { fur = \"#ffffff\"; innerEar = \"#ffffff\"; eye = \"#ffffff\"; }\n\n    // Хвост позади тела, с короткими сегментами пропорционального размера.\n    line(x - 8*s, y + 5*s, x - 16*s, y + 8*s, \"#ff638f\", 2*s);\n    line(x - 16*s, y + 8*s, x - 22*s, y + 5*s, \"#ff638f\", 2*s);\n    line(x - 22*s, y + 5*s, x - 24*s, y + 1*s, \"#ff638f\", 2*s);\n\n    // Лапы и корпус.\n    circle(x - 7*s, y + 7*s, 3.5*s, dark);\n    circle(x + 7*s, y + 7*s, 3.5*s, dark);\n    circle(x, y + 1*s, 10.5*s, dark);\n    circle(x + 1*s, y, 9*s, fur);\n    circle(x + 6*s, y + 2*s, 5*s, \"#d89cb4\");\n\n    // Уши расположены выше корпуса и не пересекают глаза.\n    circle(x - 5*s, y - 7*s, 4.2*s, dark);\n    circle(x - 5*s, y - 7*s, 2.5*s, innerEar);\n    circle(x + 6*s, y - 7*s, 4.2*s, dark);\n    circle(x + 6*s, y - 7*s, 2.5*s, innerEar);\n\n    // Морда, глаз, нос и зубы — рисуются поверх корпуса.\n    circle(x + 8*s, y + 2*s, 5*s, fur);\n    circle(x + 12*s, y + 1*s, 1.5*s, \"#ff9dbb\");\n    circle(x + 7*s, y - 3*s, 2*s, eye);\n    circle(x + 7.5*s, y - 3.5*s, 0.8*s, \"#ffffff\");\n    rect(x + 9*s, y + 4*s, 2.2*s, 3.2*s, \"#fff0d9\");\n    line(x + 10*s, y + 7*s, x + 10*s, y + 9*s, \"#fff0d9\", s);\n    line(x + 10*s, y + 2*s, x + 19*s, y - 1*s, \"#f7d9e9\", 0.8*s);\n    line(x + 10*s, y + 4*s, x + 19*s, y + 6*s, \"#f7d9e9\", 0.8*s);\n\n    // Различимые силуэты тяжёлой крысы, мутанта и босса.\n    if (kind == 1) {\n        // Бронепластинки по бокам, морда остаётся открытой.\n        line(x - 7*s, y - 2*s, x - 3*s, y - 8*s, \"#d9b7ff\", 2*s);\n        line(x - 3*s, y - 8*s, x + 3*s, y - 8*s, \"#d9b7ff\", 2*s);\n        line(x + 3*s, y - 8*s, x + 6*s, y - 3*s, \"#d9b7ff\", 2*s);\n    } else if (kind == 3) {\n        line(x - 3*s, y - 2*s, x - 13*s, y - 10*s, \"#ff62c0\", 2.5*s);\n        line(x - 13*s, y - 10*s, x - 10*s, y - 1*s, \"#ff62c0\", 2*s);\n        line(x + 3*s, y - 2*s, x + 13*s, y - 10*s, \"#ff62c0\", 2.5*s);\n        line(x + 13*s, y - 10*s, x + 10*s, y - 1*s, \"#ff62c0\", 2*s);\n    } else if (kind == 4) {\n        // У босса корона/шипы и внешний контур; морда не перекрывается.\n        circle(x, y + 1*s, 13*s, \"#7b234f\");\n        circle(x + 1*s, y, 9*s, fur);\n        line(x - 8*s, y - 7*s, x - 5*s, y - 13*s, \"#ffcc66\", 2.5*s);\n        line(x - 5*s, y - 13*s, x - 1*s, y - 7*s, \"#ffcc66\", 2.5*s);\n        line(x + 1*s, y - 7*s, x + 5*s, y - 14*s, \"#ffcc66\", 2.5*s);\n        line(x + 5*s, y - 14*s, x + 9*s, y - 7*s, \"#ffcc66\", 2.5*s);\n        circle(x + 7*s, y - 3*s, 2.3*s, eye);\n    }\n}\n\nfunction drawMainMenu() {\n    clear(\"#08111f\");\n    for (let i = 0; i \u003c length(starX); i++) {\n        circle(starX[i], starY[i], starSize[i], \"#263d59\");\n    }\n    for (let x = 0; x \u003c= 800; x += 50) line(x, 0, x, 450, \"#101f33\", 1);\n    for (let y = 0; y \u003c= 450; y += 50) line(0, y, 800, y, \"#101f33\", 1);\n    drawRat(565, 190, 30, 1, false);\n    drawRat(625, 210, 43, 4, false);\n    drawCat(225, 200, 1.8, false);\n    text(\"NEON SURVIVOR\", 250, 75, \"#7df9ff\", 30);\n    text(\"КОТ ПРОТИВ КРЫС\", 295, 108, \"#b8c9e6\", 16);\n    text(\"ЛУЧШИЙ РЕКОРД: \" + bestScore, 285, 255, \"#ffd166\", 20);\n    rect(285, 285, 230, 58, \"#123b53\");\n    rect(290, 290, 220, 48, \"#167c98\");\n    text(\"ИГРАТЬ\", 355, 320, \"#ffffff\", 24);\n    text(\"Коснись кнопки, чтобы начать\", 270, 380, \"#91a8c4\", 14);\n}\n\nfunction update(dt) {\n    if (!initialized) {\n        for (let i = 0; i \u003c 65; i++) {\n            push(starX, randomInt(0, 800));\n            push(starY, randomInt(0, 450));\n            push(starSize, randomInt(1, 2));\n        }\n        initialized = true;\n    }\n\n    if (dt > 0.04) {\n        dt = 0.04;\n    }\n    if (dt \u003c 0) {\n        dt = 0;\n    }\n\n    if (gameTime == 0 && bestScore == 0) {\n        let savedBest = load(\"neon_survivor_best\", 0);\n        if (savedBest > 0) bestScore = savedBest;\n    }\n\n    if (screen == \"menu\") {\n        for (let i = 0; i \u003c length(starY); i++) {\n            starY[i] += (8 + starSize[i] * 5) * dt;\n            if (starY[i] > 450) { starY[i] = 0; starX[i] = randomInt(0, 800); }\n        }\n        drawMainMenu();\n        let down = touchCount() > 0;\n        if (down && !menuWasDown) {\n            let tx = touchX(0);\n            let ty = touchY(0);\n            if (tx >= 270 && tx \u003c= 530 && ty >= 275 && ty \u003c= 355) {\n                resetGame();\n                screen = \"game\";\n                soundMenu();\n            }\n        }\n        menuWasDown = down;\n        return;\n    }\n\n    clear(\"#08111f\");\n\n    // Звёздный фон и сетка\n    for (let i = 0; i \u003c length(starX); i++) {\n        starY[i] += (8 + starSize[i] * 5) * dt;\n        if (starY[i] > 450) {\n            starY[i] = 0;\n            starX[i] = randomInt(0, 800);\n        }\n        circle(starX[i], starY[i], starSize[i], \"#263d59\");\n    }\n\n    for (let x = 0; x \u003c= 800; x += 50) {\n        line(x, 0, x, 450, \"#101f33\", 1);\n    }\n    for (let y = 0; y \u003c= 450; y += 50) {\n        line(0, y, 800, y, \"#101f33\", 1);\n    }\n    // Небольшие неоновые метки на сетке.\n    for (let gx = 50; gx \u003c 800; gx += 100) {\n        for (let gy = 50; gy \u003c 450; gy += 100) {\n            circle(gx, gy, 1.2, \"#24435a\");\n        }\n    }\n\n    if (gameOver) {\n        text(\"NEON SURVIVOR\", 260, 125, \"#7df9ff\", 27);\n        text(\"MISSION FAILED\", 285, 190, \"#ff5470\", 23);\n        text(\"SCORE: \" + score, 320, 235, \"#ffffff\", 21);\n        text(\"KILLS: \" + kills, 325, 265, \"#b8c9e6\", 17);\n        text(\"BEST: \" + bestScore, 330, 295, \"#ffd166\", 17);\n        rect(270, 320, 260, 48, \"#167c98\");\n        text(\"В МЕНЮ\", 350, 350, \"#ffffff\", 20);\n\n        let downOver = touchCount() > 0;\n        if (downOver && !menuWasDown) {\n            screen = \"menu\";\n        }\n        menuWasDown = downOver;\n        return;\n    }\n\n    gameTime += dt;\n    wave = 1 + floor(gameTime / 20);\n    difficultyWave = wave > 15 ? 15 : wave;\n\n    if (invulnerable > 0) {\n        invulnerable -= dt;\n    }\n    if (shieldTime > 0) {\n        shieldTime -= dt;\n    }\n    if (rapidTime > 0) {\n        rapidTime -= dt;\n    }\n    if (dashCooldown > 0) {\n        dashCooldown -= dt;\n    }\n    if (dashTime > 0) {\n        dashTime -= dt;\n    }\n    if (hitFlash > 0) {\n        hitFlash -= dt;\n    }\n    if (shake > 0) {\n        shake -= dt;\n    }\n    if (comboTimer > 0) {\n        comboTimer -= dt;\n    } else {\n        combo = 0;\n    }\n\n    // Сенсорное управление\n    let leftActive = false;\n    let rightActive = false;\n    let touches = touchCount();\n\n    for (let i = 0; i \u003c touches; i++) {\n        let tx = touchX(i);\n        let ty = touchY(i);\n\n        if (tx \u003c 400) {\n            leftActive = true;\n            joyX = (tx - 85) / 28;\n            joyY = (ty - 365) / 28;\n\n            let len = sqrt(joyX * joyX + joyY * joyY);\n            if (len > 1) {\n                joyX /= len;\n                joyY /= len;\n            }\n        } else {\n            rightActive = true;\n            joy2X = (tx - 715) / 28;\n            joy2Y = (ty - 365) / 28;\n\n            let len2 = sqrt(joy2X * joy2X + joy2Y * joy2Y);\n            if (len2 > 1) {\n                joy2X /= len2;\n                joy2Y /= len2;\n            }\n        }\n    }\n\n    if (!leftActive) {\n        joyX = 0;\n        joyY = 0;\n    }\n    if (!rightActive) {\n        joy2X = 0;\n        joy2Y = 0;\n    }\n\n    // Движение игрока\n    playerX += joyX * speed * dt;\n    playerY += joyY * speed * dt;\n\n    if (playerX \u003c 17) {\n        playerX = 17;\n    }\n    if (playerX > 783) {\n        playerX = 783;\n    }\n    if (playerY \u003c 17) {\n        playerY = 17;\n    }\n    if (playerY > 433) {\n        playerY = 433;\n    }\n\n    // Стрельба\n    fireCooldown -= dt;\n\n    if (rightActive && sqrt(joy2X * joy2X + joy2Y * joy2Y) > 0.2 && fireCooldown \u003c= 0) {\n        shoot(joy2X, joy2Y);\n\n        if (rapidTime > 0) {\n            fireCooldown = 0.075;\n        } else {\n            fireCooldown = fireRate;\n        }\n\n        soundShoot();\n    }\n\n    // Босс появляется при достижении следующей контрольной волны: 5, 10, 15, 20...\n    // Отдельный счётчик надёжнее проверки wave % 5 и не зависит от длительности боя.\n    if (!bossActive && wave >= nextBossWave) {\n        spawnBoss();\n        lastBossWave = nextBossWave;\n        nextBossWave += 5;\n        spawnTimer = 1.0;\n    }\n\n    if (bossActive) {\n        bossAttackTimer -= dt;\n        bossSummonTimer -= dt;\n        bossSpecialTimer -= dt;\n\n        if (bossAttackTimer \u003c= 0 && length(enemyX) > 0) {\n            if (bossPhase == 1) {\n                // Фаза I: точные выстрелы по игроку.\n                bossAimedShot();\n                bossAttackTimer = 1.35;\n            } else if (bossPhase == 2) {\n                // Фаза II: веер из трёх снарядов.\n                bossAimedShot();\n                let dx2 = playerX - enemyX[0];\n                let dy2 = playerY - enemyY[0];\n                let d2 = sqrt(dx2 * dx2 + dy2 * dy2);\n                if (d2 \u003c 0.01) d2 = 1;\n                let a2 = atan2(dy2, dx2);\n                let sp2 = 185 + bossWave * 2;\n                fireBossProjectile(enemyX[0], enemyY[0], cos(a2 - 0.32) * sp2, sin(a2 - 0.32) * sp2, 8, 4);\n                fireBossProjectile(enemyX[0], enemyY[0], cos(a2 + 0.32) * sp2, sin(a2 + 0.32) * sp2, 8, 4);\n                bossAttackTimer = 1.05;\n            } else {\n                // Фаза III: частые веерные атаки и круговые залпы.\n                bossAimedShot();\n                bossRadialBurst(10, 125 + bossWave * 2);\n                bossAttackTimer = 1.45;\n            }\n        }\n\n        if (bossSummonTimer \u003c= 0 && bossPhase >= 2) {\n            spawnBossMinion();\n            if (bossPhase == 3) spawnBossMinion();\n            bossSummonTimer = bossPhase == 3 ? 3.4 : 5.5;\n        }\n\n        if (bossSpecialTimer \u003c= 0 && bossPhase >= 2 && length(enemyX) > 0) {\n            // Особая механика: рывок к игроку, затем короткая пауза перед новой атакой.\n            let bx = playerX - enemyX[0];\n            let by = playerY - enemyY[0];\n            let bd = sqrt(bx * bx + by * by);\n            if (bd > 1) {\n                enemyX[0] += bx / bd * (bossPhase == 3 ? 115 : 75);\n                enemyY[0] += by / bd * (bossPhase == 3 ? 115 : 75);\n            }\n            addParticles(enemyX[0], enemyY[0], \"#ff5470\", 14);\n            bossSpecialTimer = bossPhase == 3 ? 3.8 : 5.8;\n        }\n    } else {\n        spawnTimer -= dt;\n        if (spawnTimer \u003c= 0) {\n            if (length(enemyX) \u003c 45) spawnEnemy();\n            spawnTimer = 1.15 - difficultyWave * 0.045;\n            if (spawnTimer \u003c 0.28) spawnTimer = 0.28;\n        }\n    }\n\n    // Снаряды босса: столкновение снимает здоровье и даёт короткую неуязвимость.\n    for (let p = length(bossProjectX) - 1; p >= 0; p--) {\n        bossProjectX[p] += bossProjectVx[p] * dt;\n        bossProjectY[p] += bossProjectVy[p] * dt;\n        bossProjectLife[p] -= dt;\n        let pdx = playerX - bossProjectX[p];\n        let pdy = playerY - bossProjectY[p];\n        let pr = bossProjectRadius[p] + 12;\n        if (pdx * pdx + pdy * pdy \u003c pr * pr && invulnerable \u003c= 0 && shieldTime \u003c= 0) {\n            playerHP -= 1;\n            invulnerable = 0.9;\n            hitFlash = 0.2;\n            shake = 0.15;\n            soundDamage();\n            addParticles(playerX, playerY, \"#ff5470\", 10);\n            bossProjectLife[p] = 0;\n            if (playerHP \u003c= 0) {\n                playerHP = 0;\n                gameOver = true;\n                soundGameOver();\n                if (score > bestScore) {\n                    bestScore = score;\n                    save(\"neon_survivor_best\", bestScore);\n                }\n            }\n        }\n        if (bossProjectLife[p] \u003c= 0 || bossProjectX[p] \u003c -20 || bossProjectX[p] > 820 || bossProjectY[p] \u003c -20 || bossProjectY[p] > 470) {\n            splice(bossProjectX, p, 1);\n            splice(bossProjectY, p, 1);\n            splice(bossProjectVx, p, 1);\n            splice(bossProjectVy, p, 1);\n            splice(bossProjectLife, p, 1);\n            splice(bossProjectRadius, p, 1);\n        }\n    }\n\n    // Обновление пуль и попадания\n    for (let i = length(bulletX) - 1; i >= 0; i--) {\n        bulletX[i] += bulletVx[i] * dt;\n        bulletY[i] += bulletVy[i] * dt;\n        bulletLife[i] -= dt;\n\n        if (bulletLife[i] \u003c= 0 || bulletX[i] \u003c -15 || bulletX[i] > 815 || bulletY[i] \u003c -15 || bulletY[i] > 465) {\n            splice(bulletX, i, 1);\n            splice(bulletY, i, 1);\n            splice(bulletVx, i, 1);\n            splice(bulletVy, i, 1);\n            splice(bulletLife, i, 1);\n            splice(bulletDamage, i, 1);\n        } else {\n            let hit = false;\n\n            for (let j = length(enemyX) - 1; j >= 0; j--) {\n                let dx = bulletX[i] - enemyX[j];\n                let dy = bulletY[i] - enemyY[j];\n                let r = enemyRadius[j] + 4;\n\n                if (dx * dx + dy * dy \u003c r * r) {\n                    enemyHP[j] -= bulletDamage[i];\n                    enemyFlash[j] = 0.09;\n\n                    if (enemyType[j] == 4) {\n                        let maxBossHP = 90 + bossWave * 12;\n                        let hpRatio = enemyHP[j] / maxBossHP;\n                        if (hpRatio \u003c= 0.66 && bossPhase == 1) {\n                            bossPhase = 2;\n                            bossAttackTimer = 0.35;\n                            bossSummonTimer = 1.5;\n                            bossSpecialTimer = 2.2;\n                            addParticles(enemyX[j], enemyY[j], \"#ffb347\", 28);\n                            soundBoss();\n                        } else if (hpRatio \u003c= 0.33 && bossPhase == 2) {\n                            bossPhase = 3;\n                            bossAttackTimer = 0.25;\n                            bossSummonTimer = 1.0;\n                            bossSpecialTimer = 1.5;\n                            addParticles(enemyX[j], enemyY[j], \"#ff5470\", 36);\n                            soundBoss();\n                        }\n                    }\n\n                    addParticles(bulletX[i], bulletY[i], \"#ffd166\", 3);\n\n                    splice(bulletX, i, 1);\n                    splice(bulletY, i, 1);\n                    splice(bulletVx, i, 1);\n                    splice(bulletVy, i, 1);\n                    splice(bulletLife, i, 1);\n                    splice(bulletDamage, i, 1);\n\n                    hit = true;\n\n                    if (enemyHP[j] \u003c= 0) {\n                        let defeatedType = enemyType[j];\n                        let reward = defeatedType == 4 ? 500 + bossWave * 30 : 10 + defeatedType * 5;\n                        combo += 1;\n                        comboTimer = 2.5;\n\n                        if (combo > 10) {\n                            combo = 10;\n                        }\n\n                        score += reward * combo;\n                        kills += 1;\n\n                        addParticles(enemyX[j], enemyY[j], \"#6ab04c\", 9);\n                        if (enemyType[j] == 1) {\n                            soundRatSmall();\n                        } else if (enemyType[j] == 2) {\n                            soundRatFast();\n                        } else if (enemyType[j] == 3) {\n                            soundRatTank();\n                        } else {\n                            soundBoss();\n                        }\n\n                        if (defeatedType == 4) {\n                            bossActive = false;\n                            bossProjectX = [];\n                            bossProjectY = [];\n                            bossProjectVx = [];\n                            bossProjectVy = [];\n                            bossProjectLife = [];\n                            bossProjectRadius = [];\n                            addParticles(enemyX[j], enemyY[j], \"#7df9ff\", 45);\n                            spawnPickup(enemyX[j], enemyY[j]);\n                            spawnPickup(enemyX[j] + 24, enemyY[j]);\n                            spawnPickup(enemyX[j] - 24, enemyY[j]);\n                        } else if (randomInt(0, 99) \u003c 13) {\n                            spawnPickup(enemyX[j], enemyY[j]);\n                        }\n\n                        splice(enemyX, j, 1);\n                        splice(enemyY, j, 1);\n                        splice(enemyHP, j, 1);\n                        splice(enemyMaxHP, j, 1);\n                        splice(enemyType, j, 1);\n                        splice(enemySpeed, j, 1);\n                        splice(enemyRadius, j, 1);\n                        splice(enemyFlash, j, 1);\n                    }\n\n                    break;\n                }\n            }\n        }\n    }\n\n    // Движение врагов и столкновения\n    for (let i = length(enemyX) - 1; i >= 0; i--) {\n        let dx = playerX - enemyX[i];\n        let dy = playerY - enemyY[i];\n        let dist = sqrt(dx * dx + dy * dy);\n\n        if (dist > 0.01) {\n            if (enemyType[i] == 4) {\n                // Босс перемещается по арене, не преследуя игрока как обычный враг.\n                let targetX = 400 + cos(gameTime * (bossPhase == 3 ? 1.45 : 0.8)) * (bossPhase == 3 ? 230 : 175);\n                let targetY = 105 + sin(gameTime * 1.15) * 45;\n                let tx = targetX - enemyX[i];\n                let ty = targetY - enemyY[i];\n                let td = sqrt(tx * tx + ty * ty);\n                if (td > 1) {\n                    enemyX[i] += tx / td * enemySpeed[i] * dt;\n                    enemyY[i] += ty / td * enemySpeed[i] * dt;\n                }\n            } else {\n                enemyX[i] += dx / dist * enemySpeed[i] * dt;\n                enemyY[i] += dy / dist * enemySpeed[i] * dt;\n            }\n        }\n\n        if (enemyFlash[i] > 0) {\n            enemyFlash[i] -= dt;\n        }\n\n        dx = playerX - enemyX[i];\n        dy = playerY - enemyY[i];\n        dist = sqrt(dx * dx + dy * dy);\n\n        if (dist \u003c enemyRadius[i] + 14) {\n            if (invulnerable \u003c= 0 && shieldTime \u003c= 0) {\n                playerHP -= 1;\n                invulnerable = 1.1;\n                hitFlash = 0.25;\n                shake = 0.18;\n                combo = 0;\n                comboTimer = 0;\n\n                soundDamage();\n                addParticles(playerX, playerY, \"#ff5470\", 12);\n\n                if (playerHP \u003c= 0) {\n                    playerHP = 0;\n                    gameOver = true;\n                    soundGameOver();\n                    if (score > bestScore) {\n                        bestScore = score;\n                        save(\"neon_survivor_best\", bestScore);\n                    }\n                }\n            } else if (shieldTime > 0) {\n                addParticles(enemyX[i], enemyY[i], \"#7df9ff\", 8);\n            }\n\n            if (enemyType[i] != 4) {\n                splice(enemyX, i, 1);\n                splice(enemyY, i, 1);\n                splice(enemyHP, i, 1);\n                splice(enemyMaxHP, i, 1);\n                splice(enemyType, i, 1);\n                splice(enemySpeed, i, 1);\n                splice(enemyRadius, i, 1);\n                splice(enemyFlash, i, 1);\n            }\n        }\n    }\n\n    // Бонусы\n    for (let i = length(pickupX) - 1; i >= 0; i--) {\n        pickupLife[i] -= dt;\n\n        if (pickupLife[i] \u003c= 0) {\n            splice(pickupX, i, 1);\n            splice(pickupY, i, 1);\n            splice(pickupType, i, 1);\n            splice(pickupLife, i, 1);\n        } else {\n            let dx = playerX - pickupX[i];\n            let dy = playerY - pickupY[i];\n\n            if (dx * dx + dy * dy \u003c 27 * 27) {\n                if (pickupType[i] == 0) {\n                    playerHP += 1;\n                    if (playerHP > maxHP) {\n                        playerHP = maxHP;\n                    }\n                    addParticles(playerX, playerY, \"#5cff9d\", 12);\n                } else if (pickupType[i] == 1) {\n                    shieldTime = 5;\n                    addParticles(playerX, playerY, \"#7df9ff\", 12);\n                } else {\n                    rapidTime = 6;\n                    addParticles(playerX, playerY, \"#ffd166\", 12);\n                }\n\n                score += 5;\n                soundPickup();\n\n                splice(pickupX, i, 1);\n                splice(pickupY, i, 1);\n                splice(pickupType, i, 1);\n                splice(pickupLife, i, 1);\n            }\n        }\n    }\n\n    // Частицы\n    for (let i = length(particleX) - 1; i >= 0; i--) {\n        particleLife[i] -= dt;\n        particleX[i] += particleVx[i] * dt;\n        particleY[i] += particleVy[i] * dt;\n        particleVx[i] *= 0.94;\n        particleVy[i] *= 0.94;\n\n        if (particleLife[i] \u003c= 0) {\n            splice(particleX, i, 1);\n            splice(particleY, i, 1);\n            splice(particleVx, i, 1);\n            splice(particleVy, i, 1);\n            splice(particleLife, i, 1);\n            splice(particleColor, i, 1);\n        } else {\n            circle(particleX[i], particleY[i], 2 + particleLife[i] * 3, particleColor[i]);\n        }\n    }\n\n    // Снаряды босса\n    for (let p = 0; p \u003c length(bossProjectX); p++) {\n        circle(bossProjectX[p], bossProjectY[p], bossProjectRadius[p] + 4, \"#5b243f\");\n        circle(bossProjectX[p], bossProjectY[p], bossProjectRadius[p], bossPhase == 3 ? \"#ff5470\" : \"#ffb347\");\n        circle(bossProjectX[p], bossProjectY[p], 3, \"#ffffff\");\n    }\n\n    // Отрисовка пуль\n    for (let i = 0; i \u003c length(bulletX); i++) {\n        circle(bulletX[i], bulletY[i], 7, \"#3b7185\");\n        circle(bulletX[i], bulletY[i], 3, \"#d9ffff\");\n    }\n\n    // Отрисовка бонусов\n    for (let i = 0; i \u003c length(pickupX); i++) {\n        if (pickupType[i] == 0) {\n            circle(pickupX[i], pickupY[i], 12, \"#247a53\");\n            text(\"+\", pickupX[i] - 5, pickupY[i] + 5, \"#ffffff\", 17);\n        } else if (pickupType[i] == 1) {\n            circle(pickupX[i], pickupY[i], 12, \"#245b8a\");\n            circle(pickupX[i], pickupY[i], 6, \"#7df9ff\");\n        } else {\n            circle(pickupX[i], pickupY[i], 12, \"#89651e\");\n            text(\"R\", pickupX[i] - 5, pickupY[i] + 5, \"#ffffff\", 14);\n        }\n    }\n\n    // Отрисовка крыс — мягкие цветные ореолы добавляют глубину, не мешая игре.\n    for (let i = 0; i \u003c length(enemyX); i++) {\n        let glowColor = \"#a65cff\";\n        if (enemyType[i] == 2) glowColor = \"#ff9d45\";\n        if (enemyType[i] == 3) glowColor = \"#ff62c0\";\n        if (enemyType[i] == 4) {\n            glowColor = bossPhase == 3 ? \"#ff315a\" : (bossPhase == 2 ? \"#ff9f43\" : \"#7d3cff\");\n        }\n        circle(enemyX[i], enemyY[i], enemyRadius[i] + (enemyType[i] == 4 ? 17 : 7), \"#17243b\");\n        circle(enemyX[i], enemyY[i], enemyRadius[i] + (enemyType[i] == 4 ? 11 : 4), glowColor);\n        circle(enemyX[i], enemyY[i], enemyRadius[i] + 1, \"#17243b\");\n        if (enemyType[i] == 4) {\n            // Босс — большая крыса, нарисованная игровыми примитивами без внешней картинки.\n            let bx = enemyX[i];\n            let by = enemyY[i];\n            let fur = \"#687386\";\n            let armor = \"#7d3cff\";\n            if (bossPhase == 2) armor = \"#ff9f43\";\n            if (bossPhase == 3) armor = \"#ff315a\";\n            let bob = sin(gameTime * 5) * 2;\n            // Хвост позади туловища.\n            line(bx - 22, by + 15 + bob, bx - 39, by + 20 + bob, \"#d77c91\", 5);\n            line(bx - 39, by + 20 + bob, bx - 49, by + 12 + bob, \"#d77c91\", 4);\n            line(bx - 49, by + 12 + bob, bx - 57, by + 16 + bob, \"#d77c91\", 3);\n            // Большое туловище и лапы.\n            circle(bx - 8, by + 7 + bob, 34, \"#202737\");\n            circle(bx - 8, by + 4 + bob, 31, fur);\n            circle(bx - 17, by - 5 + bob, 13, \"#8290a1\");\n            line(bx - 25, by + 24 + bob, bx - 31, by + 34 + bob, \"#3b4556\", 8);\n            line(bx + 1, by + 25 + bob, bx + 5, by + 35 + bob, \"#3b4556\", 8);\n            circle(bx - 32, by + 35 + bob, 7, \"#d77c91\");\n            circle(bx + 5, by + 36 + bob, 7, \"#d77c91\");\n            // Голова, круглые уши и розовая внутренняя часть ушей.\n            circle(bx + 19, by - 12 + bob, 25, \"#202737\");\n            circle(bx + 19, by - 14 + bob, 22, fur);\n            circle(bx + 5, by - 32 + bob, 11, \"#505d70\");\n            circle(bx + 5, by - 32 + bob, 6, \"#d77c91\");\n            circle(bx + 34, by - 32 + bob, 11, \"#505d70\");\n            circle(bx + 34, by - 32 + bob, 6, \"#d77c91\");\n            // Глаза, мордочка, нос, зубы и усы.\n            circle(bx + 28, by - 18 + bob, 5, \"#ff315a\");\n            circle(bx + 29, by - 19 + bob, 2, \"#ffffff\");\n            circle(bx + 39, by - 4 + bob, 10, \"#b6a2a0\");\n            circle(bx + 47, by - 7 + bob, 4, \"#ff8fa8\");\n            line(bx + 39, by + 1 + bob, bx + 43, by + 7 + bob, \"#ffffff\", 4);\n            line(bx + 42, by + 1 + bob, bx + 46, by + 6 + bob, \"#ffffff\", 3);\n            line(bx + 43, by - 5 + bob, bx + 57, by - 11 + bob, \"#e6eaf2\", 2);\n            line(bx + 43, by - 2 + bob, bx + 59, by - 2 + bob, \"#e6eaf2\", 2);\n            line(bx + 42, by + 1 + bob, bx + 56, by + 7 + bob, \"#e6eaf2\", 2);\n            // Светящаяся броня на спине меняет цвет в каждой фазе.\n            line(bx - 20, by - 17 + bob, bx - 7, by - 27 + bob, armor, 6);\n            line(bx - 7, by - 27 + bob, bx + 6, by - 23 + bob, armor, 6);\n            circle(bx - 5, by - 24 + bob, 4, \"#ffffff\");\n            text(\"BOSS RAT\", bx - 34, by - 54 + bob, \"#ffffff\", 13);\n        } else {\n            drawRat(enemyX[i], enemyY[i], enemyRadius[i], enemyType[i], enemyFlash[i] > 0);\n        }\n\n        // Полоска всегда рассчитывается от максимального HP именно этого врага.\n        // У разных типов крыс разное здоровье, поэтому общий максимум волны здесь неверен.\n        let barMax = enemyMaxHP[i];\n        if (barMax \u003c 1) barMax = 1;\n        let barWidth = enemyType[i] == 4 ? 90 : 30;\n        let barX = enemyX[i] - barWidth / 2;\n        let barY = enemyY[i] - enemyRadius[i] - 10;\n        rect(barX - 1, barY - 1, barWidth + 2, 5, \"#111827\");\n        rect(barX, barY, barWidth, 3, \"#29364a\");\n        let hpRatio = enemyHP[i] / barMax;\n        if (hpRatio \u003c 0) hpRatio = 0;\n        if (hpRatio > 1) hpRatio = 1;\n        if (hpRatio > 0) {\n            rect(barX, barY, barWidth * hpRatio, 3, enemyType[i] == 4 ? \"#ffb347\" : \"#ff5470\");\n        }\n    }\n\n    // Игрок — детализированный неоновый кот.\n    if (shieldTime > 0) {\n        circle(playerX, playerY, 28, \"#245b8a\");\n        circle(playerX, playerY, 24, \"#7df9ff\");\n        circle(playerX, playerY, 21, \"#10263e\");\n    }\n\n    if (invulnerable \u003c= 0 || floor(gameTime * 14) % 2 == 0) {\n        drawCat(playerX, playerY, 1, floor(gameTime * 2.5) % 9 == 0);\n    }\n\n    // Направление стрельбы\n    if (rightActive) {\n        line(playerX, playerY, playerX + joy2X * 36, playerY + joy2Y * 36, \"#7df9ff\", 4);\n    }\n\n    // Джойстики\n    circle(85, 365, 54, \"#162b43\");\n    circle(85, 365, 47, \"#233c57\");\n    circle(85 + joyX * 28, 365 + joyY * 28, 23, \"#b8c9e6\");\n    circle(85 + joyX * 28, 365 + joyY * 28, 12, \"#ffffff\");\n\n    circle(715, 365, 54, \"#162b43\");\n    circle(715, 365, 47, \"#233c57\");\n    circle(715 + joy2X * 28, 365 + joy2Y * 28, 23, \"#7df9ff\");\n    circle(715 + joy2X * 28, 365 + joy2Y * 28, 12, \"#ffffff\");\n\n    // Верхняя панель\n    rect(10, 8, 205, 91, \"#101f33\");\n    text(\"NEON SURVIVOR\", 20, 27, \"#7df9ff\", 17);\n    text(\"SCORE \" + score, 20, 49, \"#ffffff\", 15);\n    text(\"WAVE \" + wave, 20, 70, \"#ffd166\", 14);\n    text(\"KILLS \" + kills, 20, 89, \"#b8c9e6\", 13);\n\n    // Здоровье\n    text(\"HP\", 590, 25, \"#ffffff\", 14);\n    for (let i = 0; i \u003c maxHP; i++) {\n        let c = \"#29364a\";\n        if (i \u003c playerHP) {\n            c = \"#ff5470\";\n        }\n        rect(620 + i * 30, 12, 23, 13, c);\n    }\n\n    if (bossActive) {\n        text(\"BOSS PHASE \" + bossPhase + \"/3\", 315, 28, bossPhase == 3 ? \"#ff5470\" : \"#ffb347\", 18);\n        text(\"DEFEAT THE BOSS — NO NEW WAVES\", 250, 48, \"#ffffff\", 12);\n    }\n\n    if (combo > 1) {\n        text(\"COMBO x\" + combo, 330, 35, \"#ffd166\", 19);\n    }\n\n    if (shieldTime > 0) {\n        text(\"SHIELD \" + ceil(shieldTime), 610, 49, \"#7df9ff\", 13);\n    }\n    if (rapidTime > 0) {\n        text(\"RAPID FIRE \" + ceil(rapidTime), 610, 68, \"#ffd166\", 13);\n    }\n\n    if (hitFlash > 0) {\n        rect(0, 0, 800, 450, \"#6b2435\");\n    }\n\n    // Подсказка\n    if (gameTime \u003c 5) {\n        text(\"LEFT: MOVE   RIGHT: AIM + FIRE\", 235, 420, \"#b8c9e6\", 14);\n    }\n\n    if (wave > 1 && floor(gameTime) % 20 \u003c 2) {\n        text(\"WAVE \" + wave, 345, 140, \"#ffd166\", 28);\n    }\n}\n","files":{"main.mrr":"\nlet playerX = 400;\nlet playerY = 225;\nlet speed = 185;\nlet playerHP = 5;\nlet maxHP = 5;\nlet score = 0;\nlet gameOver = false;\nlet gameTime = 0;\nlet wave = 1;\n// Номер волны продолжает расти, но сложность после 15-й больше не повышается.\nlet difficultyWave = 1;\nlet kills = 0;\nlet combo = 0;\nlet comboTimer = 0;\nlet bestScore = 0;\nlet screen = \"menu\";\nlet menuWasDown = false;\n\nlet joyX = 0;\nlet joyY = 0;\nlet joy2X = 0;\nlet joy2Y = 0;\n\nlet fireCooldown = 0;\nlet fireRate = 0.17;\nlet spawnTimer = 0;\nlet hitFlash = 0;\nlet invulnerable = 0;\nlet shieldTime = 0;\nlet rapidTime = 0;\nlet dashTime = 0;\nlet dashCooldown = 0;\nlet shake = 0;\nlet paused = false;\n\nlet bulletX = [];\nlet bulletY = [];\nlet bulletVx = [];\nlet bulletVy = [];\nlet bulletLife = [];\nlet bulletDamage = [];\n\nlet enemyX = [];\nlet enemyY = [];\nlet enemyHP = [];\nlet enemyMaxHP = [];\nlet enemyType = [];\nlet enemySpeed = [];\nlet enemyRadius = [];\nlet enemyFlash = [];\n\nlet particleX = [];\nlet particleY = [];\nlet particleVx = [];\nlet particleVy = [];\nlet particleLife = [];\nlet particleColor = [];\n\nlet pickupX = [];\nlet pickupY = [];\nlet pickupType = [];\nlet pickupLife = [];\n\nlet starX = [];\nlet starY = [];\nlet starSize = [];\n\nlet initialized = false;\n\n// Состояние босса и его отдельные снаряды\nlet bossActive = false;\nlet bossWave = 0;\nlet lastBossWave = 0;\nlet nextBossWave = 5;\nlet bossPhase = 1;\nlet bossAttackTimer = 0;\nlet bossSummonTimer = 0;\nlet bossSpecialTimer = 0;\nlet bossProjectX = [];\nlet bossProjectY = [];\nlet bossProjectVx = [];\nlet bossProjectVy = [];\nlet bossProjectLife = [];\nlet bossProjectRadius = [];\n\n// Звуковые эффекты: разные высоты и ритмы на доступном playTone().\n// Текущий API MrrCode принимает частоту, длительность и громкость;\n// форму волны (sin/square/sawtooth) этот вызов не позволяет выбрать.\nfunction soundMenu() {\n    playTone(520, 0.055, 0.10);\n    playTone(780, 0.075, 0.09);\n}\n\nfunction soundShoot() {\n    playTone(randomInt(430, 570), 0.025, 0.045);\n}\n\nfunction soundRatSmall() {\n    playTone(360, 0.045, 0.10);\n    playTone(245, 0.055, 0.07);\n}\n\nfunction soundRatFast() {\n    playTone(760, 0.035, 0.075);\n    playTone(520, 0.045, 0.06);\n}\n\nfunction soundRatTank() {\n    playTone(155, 0.11, 0.13);\n    playTone(115, 0.085, 0.10);\n}\n\nfunction soundBoss() {\n    playTone(220, 0.12, 0.16);\n    playTone(165, 0.15, 0.13);\n    playTone(110, 0.20, 0.11);\n}\n\nfunction soundDamage() {\n    playTone(185, 0.075, 0.18);\n    playTone(125, 0.11, 0.16);\n}\n\nfunction soundPickup() {\n    playTone(590, 0.045, 0.10);\n    playTone(790, 0.05, 0.10);\n    playTone(1050, 0.075, 0.08);\n}\n\nfunction soundGameOver() {\n    playTone(390, 0.10, 0.13);\n    playTone(260, 0.14, 0.13);\n    playTone(175, 0.22, 0.15);\n}\n\n\nfunction resetGame() {\n    playerX = 400;\n    playerY = 225;\n    playerHP = 5;\n    score = 0;\n    gameTime = 0;\n    wave = 1;\n    difficultyWave = 1;\n    bossActive = false;\n    bossWave = 0;\n    lastBossWave = 0;\n    nextBossWave = 5;\n    bossPhase = 1;\n    bossAttackTimer = 0;\n    bossSummonTimer = 0;\n    bossSpecialTimer = 0;\n    bossProjectX = [];\n    bossProjectY = [];\n    bossProjectVx = [];\n    bossProjectVy = [];\n    bossProjectLife = [];\n    bossProjectRadius = [];\n    kills = 0;\n    combo = 0;\n    comboTimer = 0;\n    fireCooldown = 0;\n    spawnTimer = 0.5;\n    hitFlash = 0;\n    invulnerable = 1.5;\n    shieldTime = 0;\n    rapidTime = 0;\n    dashTime = 0;\n    dashCooldown = 0;\n    shake = 0;\n    gameOver = false;\n    paused = false;\n\n    bulletX = [];\n    bulletY = [];\n    bulletVx = [];\n    bulletVy = [];\n    bulletLife = [];\n    bulletDamage = [];\n\n    enemyX = [];\n    enemyY = [];\n    enemyHP = [];\n    enemyMaxHP = [];\n    enemyType = [];\n    enemySpeed = [];\n    enemyRadius = [];\n    enemyFlash = [];\n\n    particleX = [];\n    particleY = [];\n    particleVx = [];\n    particleVy = [];\n    particleLife = [];\n    particleColor = [];\n\n    pickupX = [];\n    pickupY = [];\n    pickupType = [];\n    pickupLife = [];\n\n    joyX = 0;\n    joyY = 0;\n    joy2X = 0;\n    joy2Y = 0;\n}\n\nfunction addParticles(x, y, color, amount) {\n    for (let k = 0; k \u003c amount; k++) {\n        let a = random() * 6.28318;\n        let s = randomInt(35, 155);\n        push(particleX, x);\n        push(particleY, y);\n        push(particleVx, cos(a) * s);\n        push(particleVy, sin(a) * s);\n        push(particleLife, random() * 0.45 + 0.2);\n        push(particleColor, color);\n    }\n}\n\nfunction spawnEnemy() {\n    let side = randomInt(0, 3);\n    let ex = 0;\n    let ey = 0;\n\n    if (side == 0) {\n        ex = -22;\n        ey = randomInt(20, 430);\n    } else if (side == 1) {\n        ex = 822;\n        ey = randomInt(20, 430);\n    } else if (side == 2) {\n        ex = randomInt(20, 780);\n        ey = -22;\n    } else {\n        ex = randomInt(20, 780);\n        ey = 472;\n    }\n\n    let kind = 0;\n    let roll = randomInt(0, 99);\n\n    if (difficultyWave >= 2 && roll \u003c 24) {\n        kind = 1;\n    }\n    if (difficultyWave >= 3 && roll >= 24 && roll \u003c 40) {\n        kind = 2;\n    }\n    if (difficultyWave >= 5 && roll >= 40 && roll \u003c 49) {\n        kind = 3;\n    }\n\n    let hp = 1;\n    let spd = 42 + difficultyWave * 2;\n    let radius = 15;\n\n    if (kind == 1) {\n        hp = 2;\n        spd = 29 + difficultyWave;\n        radius = 21;\n    }\n    if (kind == 2) {\n        hp = 1;\n        spd = 86 + difficultyWave * 2;\n        radius = 11;\n    }\n    if (kind == 3) {\n        hp = 4 + floor(difficultyWave / 3);\n        spd = 24 + difficultyWave;\n        radius = 25;\n    }\n\n    if (spd > 100) {\n        spd = 100;\n    }\n\n    push(enemyX, ex);\n    push(enemyY, ey);\n    push(enemyHP, hp);\n    push(enemyMaxHP, hp);\n    push(enemyType, kind);\n    push(enemySpeed, spd);\n    push(enemyRadius, radius);\n    push(enemyFlash, 0);\n}\n\nfunction spawnBoss() {\n    // Удаляем обычных врагов с арены: бой с боссом проходит отдельно.\n    enemyX = [];\n    enemyY = [];\n    enemyHP = [];\n    enemyMaxHP = [];\n    enemyType = [];\n    enemySpeed = [];\n    enemyRadius = [];\n    enemyFlash = [];\n\n    bossActive = true;\n    bossWave = difficultyWave;\n    lastBossWave = wave;\n    bossPhase = 1;\n    bossAttackTimer = 1.15;\n    bossSummonTimer = 5;\n    bossSpecialTimer = 4.5;\n\n    push(enemyX, 400);\n    push(enemyY, 105);\n    push(enemyHP, 90 + difficultyWave * 12);\n    push(enemyMaxHP, 90 + difficultyWave * 12);\n    push(enemyType, 4);\n    push(enemySpeed, 58 + difficultyWave);\n    push(enemyRadius, 35);\n    push(enemyFlash, 0);\n\n    bossProjectX = [];\n    bossProjectY = [];\n    bossProjectVx = [];\n    bossProjectVy = [];\n    bossProjectLife = [];\n    bossProjectRadius = [];\n    soundBoss();\n}\n\nfunction fireBossProjectile(x, y, vx, vy, radius, life) {\n    push(bossProjectX, x);\n    push(bossProjectY, y);\n    push(bossProjectVx, vx);\n    push(bossProjectVy, vy);\n    push(bossProjectRadius, radius);\n    push(bossProjectLife, life);\n}\n\nfunction bossAimedShot() {\n    let dx = playerX - enemyX[0];\n    let dy = playerY - enemyY[0];\n    let d = sqrt(dx * dx + dy * dy);\n    if (d \u003c 0.01) d = 1;\n    let speedShot = 150 + bossPhase * 24 + floor(bossWave * 1.5);\n    fireBossProjectile(enemyX[0], enemyY[0], dx / d * speedShot, dy / d * speedShot, 9, 4.5);\n}\n\nfunction bossRadialBurst(count, speedShot) {\n    for (let n = 0; n \u003c count; n++) {\n        let a = 6.28318 * n / count + gameTime * 0.35;\n        fireBossProjectile(enemyX[0], enemyY[0], cos(a) * speedShot, sin(a) * speedShot, 7, 4.2);\n    }\n}\n\nfunction spawnBossMinion() {\n    if (!bossActive || length(enemyX) >= 9) return;\n    let a = random() * 6.28318;\n    let ex = enemyX[0] + cos(a) * 58;\n    let ey = enemyY[0] + sin(a) * 58;\n    if (ex \u003c 20) ex = 20;\n    if (ex > 780) ex = 780;\n    if (ey \u003c 35) ey = 35;\n    if (ey > 430) ey = 430;\n\n    push(enemyX, ex);\n    push(enemyY, ey);\n    push(enemyHP, 2 + floor(bossWave / 5));\n    push(enemyMaxHP, 2 + floor(bossWave / 5));\n    push(enemyType, 2);\n    push(enemySpeed, 88 + bossWave);\n    push(enemyRadius, 11);\n    push(enemyFlash, 0);\n}\n\nfunction spawnPickup(x, y) {\n    let kind = randomInt(0, 2);\n\n    if (kind == 0 && playerHP >= maxHP) {\n        kind = 1;\n    }\n\n    push(pickupX, x);\n    push(pickupY, y);\n    push(pickupType, kind);\n    push(pickupLife, 9);\n}\n\nfunction shoot(dx, dy) {\n    let len = sqrt(dx * dx + dy * dy);\n\n    if (len \u003c 0.01) {\n        return;\n    }\n\n    dx /= len;\n    dy /= len;\n\n    let damage = 1;\n    let bulletSpeed = 430;\n\n    if (rapidTime > 0) {\n        bulletSpeed = 510;\n    }\n\n    push(bulletX, playerX + dx * 19);\n    push(bulletY, playerY + dy * 19);\n    push(bulletVx, dx * bulletSpeed);\n    push(bulletVy, dy * bulletSpeed);\n    push(bulletLife, 1.5);\n    push(bulletDamage, damage);\n\n    addParticles(playerX + dx * 20, playerY + dy * 20, \"#7df9ff\", 2);\n}\n\n// Детализированный кот, нарисованный примитивами движка.\nfunction drawCat(x, y, scale, blink) {\n    let s = scale;\n    // Неоновая тень и хвост\n    circle(x, y + 3 * s, 18 * s, \"#102b45\");\n    line(x - 10 * s, y + 9 * s, x - 19 * s, y + 14 * s, \"#27d9ff\", 4 * s);\n    line(x - 19 * s, y + 14 * s, x - 23 * s, y + 8 * s, \"#27d9ff\", 4 * s);\n    line(x - 23 * s, y + 8 * s, x - 20 * s, y + 3 * s, \"#27d9ff\", 4 * s);\n\n    // Лапы\n    circle(x - 9 * s, y + 12 * s, 6 * s, \"#153e5a\");\n    circle(x + 9 * s, y + 12 * s, 6 * s, \"#153e5a\");\n    line(x - 10 * s, y + 13 * s, x - 10 * s, y + 16 * s, \"#7df9ff\", 1.5 * s);\n    line(x + 8 * s, y + 13 * s, x + 8 * s, y + 16 * s, \"#7df9ff\", 1.5 * s);\n\n    // Голова и щёки\n    circle(x, y, 17 * s, \"#061729\");\n    circle(x, y - 1 * s, 15 * s, \"#24bce8\");\n    circle(x, y + 2 * s, 12 * s, \"#173957\");\n    circle(x - 8 * s, y + 5 * s, 6 * s, \"#236487\");\n    circle(x + 8 * s, y + 5 * s, 6 * s, \"#236487\");\n\n    // Уши с внутренней розовой частью\n    line(x - 13 * s, y - 8 * s, x - 14 * s, y - 21 * s, \"#061729\", 7 * s);\n    line(x - 14 * s, y - 21 * s, x - 3 * s, y - 14 * s, \"#061729\", 7 * s);\n    line(x + 3 * s, y - 14 * s, x + 14 * s, y - 21 * s, \"#061729\", 7 * s);\n    line(x + 14 * s, y - 21 * s, x + 13 * s, y - 8 * s, \"#061729\", 7 * s);\n    line(x - 12 * s, y - 11 * s, x - 13 * s, y - 18 * s, \"#ff62c0\", 3 * s);\n    line(x - 13 * s, y - 18 * s, x - 6 * s, y - 13 * s, \"#ff62c0\", 3 * s);\n    line(x + 6 * s, y - 13 * s, x + 13 * s, y - 18 * s, \"#ff62c0\", 3 * s);\n    line(x + 13 * s, y - 18 * s, x + 12 * s, y - 11 * s, \"#ff62c0\", 3 * s);\n\n    // Глаза, блики и брови\n    line(x - 10 * s, y - 5 * s, x - 4 * s, y - 7 * s, \"#7df9ff\", 2 * s);\n    line(x + 4 * s, y - 7 * s, x + 10 * s, y - 5 * s, \"#7df9ff\", 2 * s);\n    if (blink) {\n        line(x - 10 * s, y - 1 * s, x - 4 * s, y - 1 * s, \"#baffff\", 3 * s);\n        line(x + 4 * s, y - 1 * s, x + 10 * s, y - 1 * s, \"#baffff\", 3 * s);\n    } else {\n        circle(x - 7 * s, y - 1 * s, 4 * s, \"#b9ffff\");\n        circle(x + 7 * s, y - 1 * s, 4 * s, \"#b9ffff\");\n        circle(x - 7 * s, y - 1 * s, 2 * s, \"#061729\");\n        circle(x + 7 * s, y - 1 * s, 2 * s, \"#061729\");\n        circle(x - 8 * s, y - 3 * s, 1.3 * s, \"#ffffff\");\n        circle(x + 6 * s, y - 3 * s, 1.3 * s, \"#ffffff\");\n    }\n\n    // Нос, мордочка, улыбка и усы\n    circle(x, y + 5 * s, 2 * s, \"#ff83cb\");\n    circle(x - 3 * s, y + 7 * s, 3 * s, \"#d8faff\");\n    circle(x + 3 * s, y + 7 * s, 3 * s, \"#d8faff\");\n    line(x, y + 6 * s, x, y + 9 * s, \"#061729\", 1.3 * s);\n    line(x, y + 9 * s, x - 3 * s, y + 10 * s, \"#061729\", 1.3 * s);\n    line(x, y + 9 * s, x + 3 * s, y + 10 * s, \"#061729\", 1.3 * s);\n    line(x - 5 * s, y + 6 * s, x - 18 * s, y + 3 * s, \"#c5faff\", 1 * s);\n    line(x - 5 * s, y + 8 * s, x - 18 * s, y + 9 * s, \"#c5faff\", 1 * s);\n    line(x + 5 * s, y + 6 * s, x + 18 * s, y + 3 * s, \"#c5faff\", 1 * s);\n    line(x + 5 * s, y + 8 * s, x + 18 * s, y + 9 * s, \"#c5faff\", 1 * s);\n    // Полоски на лбу\n    line(x - 3 * s, y - 11 * s, x, y - 8 * s, \"#7df9ff\", 1.5 * s);\n    line(x + 3 * s, y - 11 * s, x, y - 8 * s, \"#7df9ff\", 1.5 * s);\n}\n\n// Крыса с длинным хвостом, ушами, глазами, зубами и лапами.\nfunction drawRat(x, y, r, kind, flash) {\n    // Силуэт крысы масштабируется равномерно; у больших видов детали\n    // не вылезают далеко за корпус и не закрывают морду бронёй.\n    let s = r / 15;\n    if (s > 2.15) s = 2.15;\n    let fur = \"#9a6a9f\";\n    let dark = \"#32233f\";\n    let innerEar = \"#ff6b9e\";\n    let eye = \"#ff405d\";\n    if (kind == 1) { fur = \"#ad73d9\"; dark = \"#3d245e\"; }\n    else if (kind == 2) { fur = \"#d58b45\"; dark = \"#57351e\"; }\n    else if (kind == 3) { fur = \"#8b4d9e\"; dark = \"#27152f\"; }\n    else if (kind == 4) { fur = \"#d94b73\"; dark = \"#481c39\"; innerEar = \"#ff9aaf\"; eye = \"#fff07a\"; }\n    if (flash) { fur = \"#ffffff\"; innerEar = \"#ffffff\"; eye = \"#ffffff\"; }\n\n    // Хвост позади тела, с короткими сегментами пропорционального размера.\n    line(x - 8*s, y + 5*s, x - 16*s, y + 8*s, \"#ff638f\", 2*s);\n    line(x - 16*s, y + 8*s, x - 22*s, y + 5*s, \"#ff638f\", 2*s);\n    line(x - 22*s, y + 5*s, x - 24*s, y + 1*s, \"#ff638f\", 2*s);\n\n    // Лапы и корпус.\n    circle(x - 7*s, y + 7*s, 3.5*s, dark);\n    circle(x + 7*s, y + 7*s, 3.5*s, dark);\n    circle(x, y + 1*s, 10.5*s, dark);\n    circle(x + 1*s, y, 9*s, fur);\n    circle(x + 6*s, y + 2*s, 5*s, \"#d89cb4\");\n\n    // Уши расположены выше корпуса и не пересекают глаза.\n    circle(x - 5*s, y - 7*s, 4.2*s, dark);\n    circle(x - 5*s, y - 7*s, 2.5*s, innerEar);\n    circle(x + 6*s, y - 7*s, 4.2*s, dark);\n    circle(x + 6*s, y - 7*s, 2.5*s, innerEar);\n\n    // Морда, глаз, нос и зубы — рисуются поверх корпуса.\n    circle(x + 8*s, y + 2*s, 5*s, fur);\n    circle(x + 12*s, y + 1*s, 1.5*s, \"#ff9dbb\");\n    circle(x + 7*s, y - 3*s, 2*s, eye);\n    circle(x + 7.5*s, y - 3.5*s, 0.8*s, \"#ffffff\");\n    rect(x + 9*s, y + 4*s, 2.2*s, 3.2*s, \"#fff0d9\");\n    line(x + 10*s, y + 7*s, x + 10*s, y + 9*s, \"#fff0d9\", s);\n    line(x + 10*s, y + 2*s, x + 19*s, y - 1*s, \"#f7d9e9\", 0.8*s);\n    line(x + 10*s, y + 4*s, x + 19*s, y + 6*s, \"#f7d9e9\", 0.8*s);\n\n    // Различимые силуэты тяжёлой крысы, мутанта и босса.\n    if (kind == 1) {\n        // Бронепластинки по бокам, морда остаётся открытой.\n        line(x - 7*s, y - 2*s, x - 3*s, y - 8*s, \"#d9b7ff\", 2*s);\n        line(x - 3*s, y - 8*s, x + 3*s, y - 8*s, \"#d9b7ff\", 2*s);\n        line(x + 3*s, y - 8*s, x + 6*s, y - 3*s, \"#d9b7ff\", 2*s);\n    } else if (kind == 3) {\n        line(x - 3*s, y - 2*s, x - 13*s, y - 10*s, \"#ff62c0\", 2.5*s);\n        line(x - 13*s, y - 10*s, x - 10*s, y - 1*s, \"#ff62c0\", 2*s);\n        line(x + 3*s, y - 2*s, x + 13*s, y - 10*s, \"#ff62c0\", 2.5*s);\n        line(x + 13*s, y - 10*s, x + 10*s, y - 1*s, \"#ff62c0\", 2*s);\n    } else if (kind == 4) {\n        // У босса корона/шипы и внешний контур; морда не перекрывается.\n        circle(x, y + 1*s, 13*s, \"#7b234f\");\n        circle(x + 1*s, y, 9*s, fur);\n        line(x - 8*s, y - 7*s, x - 5*s, y - 13*s, \"#ffcc66\", 2.5*s);\n        line(x - 5*s, y - 13*s, x - 1*s, y - 7*s, \"#ffcc66\", 2.5*s);\n        line(x + 1*s, y - 7*s, x + 5*s, y - 14*s, \"#ffcc66\", 2.5*s);\n        line(x + 5*s, y - 14*s, x + 9*s, y - 7*s, \"#ffcc66\", 2.5*s);\n        circle(x + 7*s, y - 3*s, 2.3*s, eye);\n    }\n}\n\nfunction drawMainMenu() {\n    clear(\"#08111f\");\n    for (let i = 0; i \u003c length(starX); i++) {\n        circle(starX[i], starY[i], starSize[i], \"#263d59\");\n    }\n    for (let x = 0; x \u003c= 800; x += 50) line(x, 0, x, 450, \"#101f33\", 1);\n    for (let y = 0; y \u003c= 450; y += 50) line(0, y, 800, y, \"#101f33\", 1);\n    drawRat(565, 190, 30, 1, false);\n    drawRat(625, 210, 43, 4, false);\n    drawCat(225, 200, 1.8, false);\n    text(\"NEON SURVIVOR\", 250, 75, \"#7df9ff\", 30);\n    text(\"КОТ ПРОТИВ КРЫС\", 295, 108, \"#b8c9e6\", 16);\n    text(\"ЛУЧШИЙ РЕКОРД: \" + bestScore, 285, 255, \"#ffd166\", 20);\n    rect(285, 285, 230, 58, \"#123b53\");\n    rect(290, 290, 220, 48, \"#167c98\");\n    text(\"ИГРАТЬ\", 355, 320, \"#ffffff\", 24);\n    text(\"Коснись кнопки, чтобы начать\", 270, 380, \"#91a8c4\", 14);\n}\n\nfunction update(dt) {\n    if (!initialized) {\n        for (let i = 0; i \u003c 65; i++) {\n            push(starX, randomInt(0, 800));\n            push(starY, randomInt(0, 450));\n            push(starSize, randomInt(1, 2));\n        }\n        initialized = true;\n    }\n\n    if (dt > 0.04) {\n        dt = 0.04;\n    }\n    if (dt \u003c 0) {\n        dt = 0;\n    }\n\n    if (gameTime == 0 && bestScore == 0) {\n        let savedBest = load(\"neon_survivor_best\", 0);\n        if (savedBest > 0) bestScore = savedBest;\n    }\n\n    if (screen == \"menu\") {\n        for (let i = 0; i \u003c length(starY); i++) {\n            starY[i] += (8 + starSize[i] * 5) * dt;\n            if (starY[i] > 450) { starY[i] = 0; starX[i] = randomInt(0, 800); }\n        }\n        drawMainMenu();\n        let down = touchCount() > 0;\n        if (down && !menuWasDown) {\n            let tx = touchX(0);\n            let ty = touchY(0);\n            if (tx >= 270 && tx \u003c= 530 && ty >= 275 && ty \u003c= 355) {\n                resetGame();\n                screen = \"game\";\n                soundMenu();\n            }\n        }\n        menuWasDown = down;\n        return;\n    }\n\n    clear(\"#08111f\");\n\n    // Звёздный фон и сетка\n    for (let i = 0; i \u003c length(starX); i++) {\n        starY[i] += (8 + starSize[i] * 5) * dt;\n        if (starY[i] > 450) {\n            starY[i] = 0;\n            starX[i] = randomInt(0, 800);\n        }\n        circle(starX[i], starY[i], starSize[i], \"#263d59\");\n    }\n\n    for (let x = 0; x \u003c= 800; x += 50) {\n        line(x, 0, x, 450, \"#101f33\", 1);\n    }\n    for (let y = 0; y \u003c= 450; y += 50) {\n        line(0, y, 800, y, \"#101f33\", 1);\n    }\n    // Небольшие неоновые метки на сетке.\n    for (let gx = 50; gx \u003c 800; gx += 100) {\n        for (let gy = 50; gy \u003c 450; gy += 100) {\n            circle(gx, gy, 1.2, \"#24435a\");\n        }\n    }\n\n    if (gameOver) {\n        text(\"NEON SURVIVOR\", 260, 125, \"#7df9ff\", 27);\n        text(\"MISSION FAILED\", 285, 190, \"#ff5470\", 23);\n        text(\"SCORE: \" + score, 320, 235, \"#ffffff\", 21);\n        text(\"KILLS: \" + kills, 325, 265, \"#b8c9e6\", 17);\n        text(\"BEST: \" + bestScore, 330, 295, \"#ffd166\", 17);\n        rect(270, 320, 260, 48, \"#167c98\");\n        text(\"В МЕНЮ\", 350, 350, \"#ffffff\", 20);\n\n        let downOver = touchCount() > 0;\n        if (downOver && !menuWasDown) {\n            screen = \"menu\";\n        }\n        menuWasDown = downOver;\n        return;\n    }\n\n    gameTime += dt;\n    wave = 1 + floor(gameTime / 20);\n    difficultyWave = wave > 15 ? 15 : wave;\n\n    if (invulnerable > 0) {\n        invulnerable -= dt;\n    }\n    if (shieldTime > 0) {\n        shieldTime -= dt;\n    }\n    if (rapidTime > 0) {\n        rapidTime -= dt;\n    }\n    if (dashCooldown > 0) {\n        dashCooldown -= dt;\n    }\n    if (dashTime > 0) {\n        dashTime -= dt;\n    }\n    if (hitFlash > 0) {\n        hitFlash -= dt;\n    }\n    if (shake > 0) {\n        shake -= dt;\n    }\n    if (comboTimer > 0) {\n        comboTimer -= dt;\n    } else {\n        combo = 0;\n    }\n\n    // Сенсорное управление\n    let leftActive = false;\n    let rightActive = false;\n    let touches = touchCount();\n\n    for (let i = 0; i \u003c touches; i++) {\n        let tx = touchX(i);\n        let ty = touchY(i);\n\n        if (tx \u003c 400) {\n            leftActive = true;\n            joyX = (tx - 85) / 28;\n            joyY = (ty - 365) / 28;\n\n            let len = sqrt(joyX * joyX + joyY * joyY);\n            if (len > 1) {\n                joyX /= len;\n                joyY /= len;\n            }\n        } else {\n            rightActive = true;\n            joy2X = (tx - 715) / 28;\n            joy2Y = (ty - 365) / 28;\n\n            let len2 = sqrt(joy2X * joy2X + joy2Y * joy2Y);\n            if (len2 > 1) {\n                joy2X /= len2;\n                joy2Y /= len2;\n            }\n        }\n    }\n\n    if (!leftActive) {\n        joyX = 0;\n        joyY = 0;\n    }\n    if (!rightActive) {\n        joy2X = 0;\n        joy2Y = 0;\n    }\n\n    // Движение игрока\n    playerX += joyX * speed * dt;\n    playerY += joyY * speed * dt;\n\n    if (playerX \u003c 17) {\n        playerX = 17;\n    }\n    if (playerX > 783) {\n        playerX = 783;\n    }\n    if (playerY \u003c 17) {\n        playerY = 17;\n    }\n    if (playerY > 433) {\n        playerY = 433;\n    }\n\n    // Стрельба\n    fireCooldown -= dt;\n\n    if (rightActive && sqrt(joy2X * joy2X + joy2Y * joy2Y) > 0.2 && fireCooldown \u003c= 0) {\n        shoot(joy2X, joy2Y);\n\n        if (rapidTime > 0) {\n            fireCooldown = 0.075;\n        } else {\n            fireCooldown = fireRate;\n        }\n\n        soundShoot();\n    }\n\n    // Босс появляется при достижении следующей контрольной волны: 5, 10, 15, 20...\n    // Отдельный счётчик надёжнее проверки wave % 5 и не зависит от длительности боя.\n    if (!bossActive && wave >= nextBossWave) {\n        spawnBoss();\n        lastBossWave = nextBossWave;\n        nextBossWave += 5;\n        spawnTimer = 1.0;\n    }\n\n    if (bossActive) {\n        bossAttackTimer -= dt;\n        bossSummonTimer -= dt;\n        bossSpecialTimer -= dt;\n\n        if (bossAttackTimer \u003c= 0 && length(enemyX) > 0) {\n            if (bossPhase == 1) {\n                // Фаза I: точные выстрелы по игроку.\n                bossAimedShot();\n                bossAttackTimer = 1.35;\n            } else if (bossPhase == 2) {\n                // Фаза II: веер из трёх снарядов.\n                bossAimedShot();\n                let dx2 = playerX - enemyX[0];\n                let dy2 = playerY - enemyY[0];\n                let d2 = sqrt(dx2 * dx2 + dy2 * dy2);\n                if (d2 \u003c 0.01) d2 = 1;\n                let a2 = atan2(dy2, dx2);\n                let sp2 = 185 + bossWave * 2;\n                fireBossProjectile(enemyX[0], enemyY[0], cos(a2 - 0.32) * sp2, sin(a2 - 0.32) * sp2, 8, 4);\n                fireBossProjectile(enemyX[0], enemyY[0], cos(a2 + 0.32) * sp2, sin(a2 + 0.32) * sp2, 8, 4);\n                bossAttackTimer = 1.05;\n            } else {\n                // Фаза III: частые веерные атаки и круговые залпы.\n                bossAimedShot();\n                bossRadialBurst(10, 125 + bossWave * 2);\n                bossAttackTimer = 1.45;\n            }\n        }\n\n        if (bossSummonTimer \u003c= 0 && bossPhase >= 2) {\n            spawnBossMinion();\n            if (bossPhase == 3) spawnBossMinion();\n            bossSummonTimer = bossPhase == 3 ? 3.4 : 5.5;\n        }\n\n        if (bossSpecialTimer \u003c= 0 && bossPhase >= 2 && length(enemyX) > 0) {\n            // Особая механика: рывок к игроку, затем короткая пауза перед новой атакой.\n            let bx = playerX - enemyX[0];\n            let by = playerY - enemyY[0];\n            let bd = sqrt(bx * bx + by * by);\n            if (bd > 1) {\n                enemyX[0] += bx / bd * (bossPhase == 3 ? 115 : 75);\n                enemyY[0] += by / bd * (bossPhase == 3 ? 115 : 75);\n            }\n            addParticles(enemyX[0], enemyY[0], \"#ff5470\", 14);\n            bossSpecialTimer = bossPhase == 3 ? 3.8 : 5.8;\n        }\n    } else {\n        spawnTimer -= dt;\n        if (spawnTimer \u003c= 0) {\n            if (length(enemyX) \u003c 45) spawnEnemy();\n            spawnTimer = 1.15 - difficultyWave * 0.045;\n            if (spawnTimer \u003c 0.28) spawnTimer = 0.28;\n        }\n    }\n\n    // Снаряды босса: столкновение снимает здоровье и даёт короткую неуязвимость.\n    for (let p = length(bossProjectX) - 1; p >= 0; p--) {\n        bossProjectX[p] += bossProjectVx[p] * dt;\n        bossProjectY[p] += bossProjectVy[p] * dt;\n        bossProjectLife[p] -= dt;\n        let pdx = playerX - bossProjectX[p];\n        let pdy = playerY - bossProjectY[p];\n        let pr = bossProjectRadius[p] + 12;\n        if (pdx * pdx + pdy * pdy \u003c pr * pr && invulnerable \u003c= 0 && shieldTime \u003c= 0) {\n            playerHP -= 1;\n            invulnerable = 0.9;\n            hitFlash = 0.2;\n            shake = 0.15;\n            soundDamage();\n            addParticles(playerX, playerY, \"#ff5470\", 10);\n            bossProjectLife[p] = 0;\n            if (playerHP \u003c= 0) {\n                playerHP = 0;\n                gameOver = true;\n                soundGameOver();\n                if (score > bestScore) {\n                    bestScore = score;\n                    save(\"neon_survivor_best\", bestScore);\n                }\n            }\n        }\n        if (bossProjectLife[p] \u003c= 0 || bossProjectX[p] \u003c -20 || bossProjectX[p] > 820 || bossProjectY[p] \u003c -20 || bossProjectY[p] > 470) {\n            splice(bossProjectX, p, 1);\n            splice(bossProjectY, p, 1);\n            splice(bossProjectVx, p, 1);\n            splice(bossProjectVy, p, 1);\n            splice(bossProjectLife, p, 1);\n            splice(bossProjectRadius, p, 1);\n        }\n    }\n\n    // Обновление пуль и попадания\n    for (let i = length(bulletX) - 1; i >= 0; i--) {\n        bulletX[i] += bulletVx[i] * dt;\n        bulletY[i] += bulletVy[i] * dt;\n        bulletLife[i] -= dt;\n\n        if (bulletLife[i] \u003c= 0 || bulletX[i] \u003c -15 || bulletX[i] > 815 || bulletY[i] \u003c -15 || bulletY[i] > 465) {\n            splice(bulletX, i, 1);\n            splice(bulletY, i, 1);\n            splice(bulletVx, i, 1);\n            splice(bulletVy, i, 1);\n            splice(bulletLife, i, 1);\n            splice(bulletDamage, i, 1);\n        } else {\n            let hit = false;\n\n            for (let j = length(enemyX) - 1; j >= 0; j--) {\n                let dx = bulletX[i] - enemyX[j];\n                let dy = bulletY[i] - enemyY[j];\n                let r = enemyRadius[j] + 4;\n\n                if (dx * dx + dy * dy \u003c r * r) {\n                    enemyHP[j] -= bulletDamage[i];\n                    enemyFlash[j] = 0.09;\n\n                    if (enemyType[j] == 4) {\n                        let maxBossHP = 90 + bossWave * 12;\n                        let hpRatio = enemyHP[j] / maxBossHP;\n                        if (hpRatio \u003c= 0.66 && bossPhase == 1) {\n                            bossPhase = 2;\n                            bossAttackTimer = 0.35;\n                            bossSummonTimer = 1.5;\n                            bossSpecialTimer = 2.2;\n                            addParticles(enemyX[j], enemyY[j], \"#ffb347\", 28);\n                            soundBoss();\n                        } else if (hpRatio \u003c= 0.33 && bossPhase == 2) {\n                            bossPhase = 3;\n                            bossAttackTimer = 0.25;\n                            bossSummonTimer = 1.0;\n                            bossSpecialTimer = 1.5;\n                            addParticles(enemyX[j], enemyY[j], \"#ff5470\", 36);\n                            soundBoss();\n                        }\n                    }\n\n                    addParticles(bulletX[i], bulletY[i], \"#ffd166\", 3);\n\n                    splice(bulletX, i, 1);\n                    splice(bulletY, i, 1);\n                    splice(bulletVx, i, 1);\n                    splice(bulletVy, i, 1);\n                    splice(bulletLife, i, 1);\n                    splice(bulletDamage, i, 1);\n\n                    hit = true;\n\n                    if (enemyHP[j] \u003c= 0) {\n                        let defeatedType = enemyType[j];\n                        let reward = defeatedType == 4 ? 500 + bossWave * 30 : 10 + defeatedType * 5;\n                        combo += 1;\n                        comboTimer = 2.5;\n\n                        if (combo > 10) {\n                            combo = 10;\n                        }\n\n                        score += reward * combo;\n                        kills += 1;\n\n                        addParticles(enemyX[j], enemyY[j], \"#6ab04c\", 9);\n                        if (enemyType[j] == 1) {\n                            soundRatSmall();\n                        } else if (enemyType[j] == 2) {\n                            soundRatFast();\n                        } else if (enemyType[j] == 3) {\n                            soundRatTank();\n                        } else {\n                            soundBoss();\n                        }\n\n                        if (defeatedType == 4) {\n                            bossActive = false;\n                            bossProjectX = [];\n                            bossProjectY = [];\n                            bossProjectVx = [];\n                            bossProjectVy = [];\n                            bossProjectLife = [];\n                            bossProjectRadius = [];\n                            addParticles(enemyX[j], enemyY[j], \"#7df9ff\", 45);\n                            spawnPickup(enemyX[j], enemyY[j]);\n                            spawnPickup(enemyX[j] + 24, enemyY[j]);\n                            spawnPickup(enemyX[j] - 24, enemyY[j]);\n                        } else if (randomInt(0, 99) \u003c 13) {\n                            spawnPickup(enemyX[j], enemyY[j]);\n                        }\n\n                        splice(enemyX, j, 1);\n                        splice(enemyY, j, 1);\n                        splice(enemyHP, j, 1);\n                        splice(enemyMaxHP, j, 1);\n                        splice(enemyType, j, 1);\n                        splice(enemySpeed, j, 1);\n                        splice(enemyRadius, j, 1);\n                        splice(enemyFlash, j, 1);\n                    }\n\n                    break;\n                }\n            }\n        }\n    }\n\n    // Движение врагов и столкновения\n    for (let i = length(enemyX) - 1; i >= 0; i--) {\n        let dx = playerX - enemyX[i];\n        let dy = playerY - enemyY[i];\n        let dist = sqrt(dx * dx + dy * dy);\n\n        if (dist > 0.01) {\n            if (enemyType[i] == 4) {\n                // Босс перемещается по арене, не преследуя игрока как обычный враг.\n                let targetX = 400 + cos(gameTime * (bossPhase == 3 ? 1.45 : 0.8)) * (bossPhase == 3 ? 230 : 175);\n                let targetY = 105 + sin(gameTime * 1.15) * 45;\n                let tx = targetX - enemyX[i];\n                let ty = targetY - enemyY[i];\n                let td = sqrt(tx * tx + ty * ty);\n                if (td > 1) {\n                    enemyX[i] += tx / td * enemySpeed[i] * dt;\n                    enemyY[i] += ty / td * enemySpeed[i] * dt;\n                }\n            } else {\n                enemyX[i] += dx / dist * enemySpeed[i] * dt;\n                enemyY[i] += dy / dist * enemySpeed[i] * dt;\n            }\n        }\n\n        if (enemyFlash[i] > 0) {\n            enemyFlash[i] -= dt;\n        }\n\n        dx = playerX - enemyX[i];\n        dy = playerY - enemyY[i];\n        dist = sqrt(dx * dx + dy * dy);\n\n        if (dist \u003c enemyRadius[i] + 14) {\n            if (invulnerable \u003c= 0 && shieldTime \u003c= 0) {\n                playerHP -= 1;\n                invulnerable = 1.1;\n                hitFlash = 0.25;\n                shake = 0.18;\n                combo = 0;\n                comboTimer = 0;\n\n                soundDamage();\n                addParticles(playerX, playerY, \"#ff5470\", 12);\n\n                if (playerHP \u003c= 0) {\n                    playerHP = 0;\n                    gameOver = true;\n                    soundGameOver();\n                    if (score > bestScore) {\n                        bestScore = score;\n                        save(\"neon_survivor_best\", bestScore);\n                    }\n                }\n            } else if (shieldTime > 0) {\n                addParticles(enemyX[i], enemyY[i], \"#7df9ff\", 8);\n            }\n\n            if (enemyType[i] != 4) {\n                splice(enemyX, i, 1);\n                splice(enemyY, i, 1);\n                splice(enemyHP, i, 1);\n                splice(enemyMaxHP, i, 1);\n                splice(enemyType, i, 1);\n                splice(enemySpeed, i, 1);\n                splice(enemyRadius, i, 1);\n                splice(enemyFlash, i, 1);\n            }\n        }\n    }\n\n    // Бонусы\n    for (let i = length(pickupX) - 1; i >= 0; i--) {\n        pickupLife[i] -= dt;\n\n        if (pickupLife[i] \u003c= 0) {\n            splice(pickupX, i, 1);\n            splice(pickupY, i, 1);\n            splice(pickupType, i, 1);\n            splice(pickupLife, i, 1);\n        } else {\n            let dx = playerX - pickupX[i];\n
