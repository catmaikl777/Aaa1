        // Overlap distances\n        let overlapX = 20 + obsHalfW - abs(diffX)\n        let overlapY = 20 + obsHalfH - abs(diffY)\n        if (overlapX > 0 && overlapY > 0) {\n            // Resolve the smallest penetration first\n            if (overlapX \u003c overlapY) {\n                // Horizontal resolution\n                if (diffX > 0) {\n                    body.x = body.x + overlapX\n                } else {\n                    body.x = body.x - overlapX\n                }\n                body.vx = 0\n            } else {\n                // Vertical resolution\n                if (diffY > 0) {\n                    // Player is below obstacle\n                    body.y = body.y + overlapY\n                    body.vy = 0\n                } else {\n                    // Player is above obstacle\n                    body.y = body.y - overlapY\n                    body.vy = 0\n                    onGround = true\n                }\n            }\n        }\n        i = i + 1\n    }\n}\n\nfunction spawnHazard() {\n    let side = randomInt(0, 3) // 0 top, 1 left, 2 right\n    let hx = 0\n    let hy = 0\n    let hvx = 0\n    let hvy = 0\n    if (side == 0) {\n        hx = randomInt(0, 800)\n        hy = -30\n        hvx = 0\n        hvy = 200\n    } else if (side == 1) {\n        hx = -30\n        hy = randomInt(0, 450)\n        hvx = 200\n        hvy = 0\n    } else {\n        hx = 830\n        hy = randomInt(0, 450)\n        hvx = -200\n        hvy = 0\n    }\n    let hazard = {x: hx, y: hy, w: 30, h: 30, vx: hvx, vy: hvy, color: \"#ff4444\"}\n    push(hazards, hazard)\n}\n\nfunction spawnCoin() {\n    let cx = randomInt(0, 800)\n    let cy = -20\n    let coin = {x: cx, y: cy, r: 10, color: \"#ffdd55\"}\n    push(coins, coin)\n}\n\nfunction update(dt) {\n    drawBG()\n\n    // Reset horizontal velocity each frame\n    player.vx = 0\n\n    // Multitouch input handling for on‑screen buttons\n    let i = 0\n    while (i \u003c touchCount()) {\n        let px = touchX(i)\n        let py = touchY(i)\n        // Left button\n        if (overlapRect(px, py, 1, 1, leftBtnObj.x, leftBtnObj.y, leftBtnObj.w, leftBtnObj.h)) {\n            player.vx = -200\n        }\n        // Right button\n        if (overlapRect(px, py, 1, 1, rightBtnObj.x, rightBtnObj.y, rightBtnObj.w, rightBtnObj.h)) {\n            player.vx = 200\n        }\n        // Jump button (only when on ground)\n        if (overlapRect(px, py, 1, 1, jumpBtnObj.x, jumpBtnObj.y, jumpBtnObj.w, jumpBtnObj.h) && onGround) {\n            player.vy = -400\n        }\n        i = i + 1\n    }\n\n    // Apply physics (gravity = 500)\n    player = moveBody(player, dt, 500)\n\n    // Resolve collisions with ground and platforms\n    resolveCollisions(player)\n\n    // Sync scene object position with physics body\n    playerObj.x = player.x\n    playerObj.y = player.y\n\n    // Draw ground and platforms using scene object properties\n    rect(groundObj.x, groundObj.y, groundObj.w, groundObj.h, groundObj.color)\n    rect(platformRObj.x, platformRObj.y, platformRObj.w, platformRObj.h, platformRObj.color)\n    rect(platformLObj.x, platformLObj.y, platformLObj.w, platformLObj.h, platformLObj.color)\n    rect(platformJObj.x, platformJObj.y, platformJObj.w, platformJObj.h, platformJObj.color)\n\n    // Draw UI buttons (white rectangles)\n    rect(leftBtnObj.x, leftBtnObj.y, leftBtnObj.w, leftBtnObj.h, leftBtnObj.color)\n    rect(rightBtnObj.x, rightBtnObj.y, rightBtnObj.w, rightBtnObj.h, rightBtnObj.color)\n    rect(jumpBtnObj.x, jumpBtnObj.y, jumpBtnObj.w, jumpBtnObj.h, jumpBtnObj.color)\n\n    // Draw the player (blue circle) using scene object position\n    circle(playerObj.x, playerObj.y, playerObj.r, playerObj.color)\n\n    // Update hazard timer and spawn\n    hazardTimer = hazardTimer - dt\n    if (hazardTimer \u003c= 0) {\n        spawnHazard()\n        hazardTimer = randomInt(1, 1)\n    }\n\n    // Update coin timer and spawn\n    coinTimer = coinTimer - dt\n    if (coi let pointer={x:0,y:0,down:false},touches=[],last=0,startTime=performance.now(),handlers={},images={},gameBackground='#101827',cameraOffset={x:0,y:0},audioContext=null;
const savedTouches=new Map();
const scene=Array.isArray(project.scene)?project.scene:[];
for(const s of project.sprites||[]){const im=new Image();im.src=s.dataUrl||'';images[s.name]=im;}
function coords(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*450/r.height};}
canvas.addEventListener('pointerdown',e=>{const q=coords(e);pointer=Object.assign(q,{down:true});savedTouches.set(e.pointerId,q);touches=Array.from(savedTouches.values());canvas.setPointerCapture?.(e.pointerId);call('pointerDown',pointer.x,pointer.y);});
canvas.addEventListener('pointermove',e=>{const q=coords(e);pointer.x=q.x;pointer.y=q.y;if(savedTouches.has(e.pointerId))savedTouches.set(e.pointerId,q);touches=Array.from(savedTouches.values());if(pointer.down)call('pointerMove',q.x,q.y);});
function up(e){const q=coords(e);pointer.x=q.x;pointer.y=q.y;pointer.down=false;savedTouches.delete(e.pointerId);touches=Array.from(savedTouches.values());call('pointerUp',q.x,q.y);}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function background(color='#101827'){gameBackground=typeof color==='string'?color:'#101827';ctx.fillStyle=gameBackground;ctx.fillRect(0,0,800,450);}
function clear(color=gameBackground){ctx.fillStyle=typeof color==='string'?color:gameBackground;ctx.fillRect(0,0,800,450);}
function rect(x,y,w,h,color='#70d6ff'){ctx.fillStyle=String(color);ctx.fillRect((Number(x)||0)-cameraOffset.x,(Number(y)||0)-cameraOffset.y,Number(w)||0,Number(h)||0);}
function circle(x,y,r,color='#70d6ff'){ctx.fillStyle=String(color);ctx.beginPath();ctx.arc((Number(x)||0)-cameraOffset.x,(Number(y)||0)-cameraOffset.y,Math.max(0,Number(r)||0),0,Math.PI*2);ctx.fill();}
function line(x1,y1,x2,y2,color='#fff',width=2){ctx.strokeStyle=String(color);ctx.lineWidth=Number(width)||2;ctx.beginPath();ctx.moveTo(Number(x1)-cameraOffset.x,Number(y1)-cameraOffset.y);ctx.lineTo(Number(x2)-cameraOffset.x,Number(y2)-cameraOffset.y);ctx.stroke();}
function text(value,x,y,color='#fff',size=16){ctx.fillStyle=String(color);ctx.font='600 '+(Number(size)||16)+'px system-ui,sans-serif';ctx.textBaseline='top';ctx.fillText(String(value??''),(Number(x)||0)-cameraOffset.x,(Number(y)||0)-cameraOffset.y);}
function sprite(name,x,y,w,h){const im=images[String(name)];if(im&&im.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(im,(Number(x)||0)-cameraOffset.x,(Number(y)||0)-cameraOffset.y,w==null?im.naturalWidth:Number(w),h==null?im.naturalHeight:Number(h));}}
function spriteAnim(name,x,y,w,h,frameW,frameH,fps){const im=images[String(name)];if(!im||!im.complete||!im.naturalWidth)return sprite(name,x,y,w,h);const fw=Math.max(1,Number(frameW)||Number(w)||32),fh=Math.max(1,Number(frameH)||Number(h)||32),cols=Math.max(1,Math.floor(im.naturalWidth/fw)),rows=Math.max(1,Math.floor(im.naturalHeight/fh)),count=cols*rows,frame=Math.floor((performance.now()-startTime)/1000*Math.max(1,Number(fps)||8))%count;ctx.imageSmoothingEnabled=false;ctx.drawImage(im,(frame%cols)*fw,Math.floor(frame/cols)*fh,fw,fh,(Number(x)||0)-cameraOffset.x,(Number(y)||0)-cameraOffset.y,Number(w)||fw,Number(h)||fh);}
function camera(x=0,y=0){cameraOffset.x=Number(x)||0;cameraOffset.y=Number(y)||0;}
function rgba(r,g,b,a=1){return 'rgba('+(Number(r)||0)+','+(Number(g)||0)+','+(Number(b)||0)+','+(a==null?1:Number(a))+')';}
function object(name){return scene.find(o=>String(o.name)===String(name))||null;}
function renderScene(){for(const o of scene){if(!o)continue;const x=Number(o.x)||0,y=Number(o.y)||0;if(o.type==='rect'){ctx.fillStyle=o.color||'#ff8844';ctx.fillRect(x-cameraOffset.x,y-cameraOffset.y,Number(o.w)||0,Number(o.h)||0);}else if(o.type==='circle'){ctx.fillStyle=o.color||'#70d6ff';ctx.beginPath();ctx.arc(x-cameraOffset.x,y-cameraOffset.y,Math.max(0,Number(o.r)||0),0,Math.PI*2);ctx.fill();}else if(o.type==='text'){ctx.fillStyle=o.color||'#fff';ctx.font='600 '+(Number(o.size)||18)+'px system-ui,sans-serif';ctx.textBaseline='top';ctx.fillText(String(o.text||o.name||''),x-cameraOffset.x,y-cameraOffset.y);}}}
function print(...a){console.log(...a)}
function save(key,value){try{localStorage.setItem('mrr-save:'+String(key),JSON.stringify(value));return true;}catch(_){return false;}}
function load(key,defaultValue=null){try{const raw=localStorage.getItem('mrr-save:'+String(key));return raw===null?defaultValue:JSON.parse(raw);}catch(_){return defaultValue;}}
